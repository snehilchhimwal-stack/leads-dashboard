<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Frontend regression harness</title>
<!--
  ============================================================
  tests/frontend-harness.html — saved, re-runnable browser-JS
  regression harness for dashboard.html + js/*.js.

  WHY THIS EXISTS: the dashboard has zero committed frontend tests (the
  11 Tests_*.gs files only cover the Apps Script backend). Every prior
  verification of a frontend change in this project's history was an ad
  hoc synthetic-data probe built fresh each time and thrown away. This
  file formalizes that same proven technique — mock the network boundary
  (sheetsApiValuesGet + the OAuth token pair), run the REAL render
  pipeline against synthetic data, assert on the resulting DOM — into one
  saved file that never drifts from the real app, because it loads
  dashboard.html and js/*.js LIVE at run time rather than embedding a
  copy of either:
    1. fetch()es the real dashboard.html and grafts its <body> into this
       page, so every element id a render function targets already exists.
    2. Reads dashboard.html's OWN <script src="js/..."> list (in its own
       declared order) and injects those exact files — a future file
       added/removed/reordered in dashboard.html is picked up here
       automatically; this harness can never silently go stale against it.
    3. Overrides sheetsApiValuesGet (the single real network-read choke
       point every js/*.js file goes through — see core.js) to serve a
       synthetic Leads-tab dataset and an empty array for every other
       tab (Movement_Log / Daily_RM_Issues / RM_Hierarchy / ...), so the
       "no history yet" / "MovementTracker.gs not set up" degrade paths
       get exercised for free rather than skipped.
    4. Runs fetchAndRender() for real, waits out its two chained
       setTimeout(...,0) render passes (see applyFiltersAndRender in
       core.js — the same reason earlier ad hoc runs needed calling
       twice for determinism), then asserts against the live DOM.

  HOW TO RUN: preview_start the "dashboard" launch config (serves the
  whole repo over http, which fetch() here needs — this will NOT work
  opened as a local file:// page), then navigate to
  /tests/frontend-harness.html. Read window.__harnessResults or the
  on-page log afterward, or read_console_messages for the single
  HARNESS_RESULT line this prints as JSON.

  COVERAGE (first slice — see HANDOVER.md refactor notes for what's
  still deferred): Overview (KPI strip, region table), all 7 Operations
  alert-card issue types plus Approaching-48h, People (RM Workload),
  Audit (renders), tab switching, and the graceful empty-history path
  for Repeat Offenders/Movement/Tracking. NOT yet covered: those three
  tabs' actual DATA-populated paths (would need synthetic Movement_Log
  and Daily_RM_Issues rows too), Reports/Gmail send flows, Sheets
  write-back paths (snapshot, follow-ups push, SLA history) — those
  mock `fetch`/`sheetsApiValuesGet` themselves per-test, following this
  same pattern, the way earlier ad hoc verification already did.
  ============================================================
-->
<style>
  body{ font-family:'Consolas','IBM Plex Mono',monospace; background:#0f1216; color:#e7eaee; padding:20px; }
  #status{ font-size:15px; font-weight:600; margin-bottom:10px; }
  #log{ white-space:pre-wrap; font-size:12.5px; line-height:1.6; }
</style>
</head>
<body>
<div id="status">Loading dashboard.html…</div>
<pre id="log"></pre>
<script>
// ---- Freeze the clock (t-tf-5ad22d8e4c2e) ----
// Every fixture is built relative to "now" (`ago(h)`), and the real app
// stamps `_renderNow = new Date()` at the start of each render pass. The
// SLA rules that count *working* minutes (9 AM–7 PM IST) —
// `neverConnectedPastWindow`, "Behind on Today's Calls" — then behave
// differently depending on the wall-clock time this harness happens to
// run at (e.g. the L011 "missed first-contact inside the 3 h grace"
// assertion is only meaningful during IST business hours). Pin Date to a
// fixed weekday IST-afternoon instant so the harness is deterministic in
// CI regardless of when it runs.
(function freezeClock() {
  const FROZEN_MS = Date.UTC(2026, 8, 9, 8, 30, 0); // 2026-09-09 14:00:00 IST (a Wednesday)
  const RealDate = Date;
  function FakeDate(...args) {
    return args.length ? new RealDate(...args) : new RealDate(FROZEN_MS);
  }
  FakeDate.prototype = RealDate.prototype;
  FakeDate.now = () => FROZEN_MS;
  FakeDate.parse = RealDate.parse;
  FakeDate.UTC = RealDate.UTC;
  // eslint-disable-next-line no-global-assign
  Date = FakeDate;
})();
(async function () {
  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const results = { pass: 0, fail: 0, failures: [] };

  function log(line) { logEl.textContent += line + '\n'; }
  function assert(name, cond, detail) {
    if (cond) { results.pass++; log('PASS  ' + name); }
    else { results.fail++; results.failures.push(name + (detail ? ' — ' + detail : '')); log('FAIL  ' + name + (detail ? ' — ' + detail : '')); }
  }

  // ---- 1. Fetch the REAL dashboard.html and graft its body into this page ----
  let htmlText;
  try {
    htmlText = await fetch('../dashboard.html').then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    });
  } catch (e) {
    statusEl.textContent = 'FATAL: could not fetch ../dashboard.html — this harness must be served over http (preview_start the "dashboard" config), not opened as a local file. ' + e.message;
    statusEl.style.color = '#ff5d5d';
    return;
  }
  const parsed = new DOMParser().parseFromString(htmlText, 'text/html');

  const harnessUi = document.createElement('div');
  harnessUi.id = '__harnessUi';
  harnessUi.style.cssText = 'position:fixed; top:0; right:0; width:420px; max-height:100vh; overflow:auto; background:#0f1216; border-left:1px solid #2a3038; padding:16px; z-index:99999;';
  harnessUi.appendChild(statusEl);
  harnessUi.appendChild(logEl);

  document.body.innerHTML = parsed.body.innerHTML;
  document.body.appendChild(harnessUi);

  const authGate = document.getElementById('authGate');
  if (authGate) authGate.style.display = 'none';
  const appShell = document.getElementById('appShell');
  if (appShell) appShell.style.display = '';

  // ---- 2. Load the real js/*.js files, in dashboard.html's OWN declared order ----
  const scriptSrcs = Array.from(parsed.querySelectorAll('script[src^="js/"]')).map(s => s.getAttribute('src'));
  if (!scriptSrcs.length) {
    statusEl.textContent = 'FATAL: found no <script src="js/..."> tags in dashboard.html — did its markup change shape?';
    statusEl.style.color = '#ff5d5d';
    return;
  }
  for (const src of scriptSrcs) {
    await new Promise((resolve, reject) => {
      const tag = document.createElement('script');
      tag.src = '../' + src;
      tag.onload = resolve;
      tag.onerror = () => reject(new Error('failed to load ' + src));
      document.head.appendChild(tag);
    });
  }
  statusEl.textContent = 'Scripts loaded (' + scriptSrcs.length + '). Building synthetic dataset…';

  // ---- 2a. isOppOrAbove: closing_reason/lead_closing_reason fallback (2026-09-09) ----
  // Direct function-level coverage, mirroring Tests_Core.gs's isOppOrAbove_
  // block on the backend so the two runtimes stay provably in sync. Not
  // exercised through the synthetic-lead/DOM path below on purpose: most of
  // this function's real callers (the KPI "Opportunity+" tile, Movement's
  // crossing detection, Tracking's snapshot stats) read its raw boolean
  // directly and are NOT gated by isOpenLead/excluded the way the
  // Operations issue lists are — a lead with ANY non-blank closing_reason/
  // lead_closing_reason already reads as "excluded" there regardless of
  // what this fallback decides, so routing this through a synthetic row
  // and asserting on an issue-card list would silently test nothing. See
  // isOppOrAbove's own comment (core-lead-model.js) for the full incident
  // context (lead 2229674, 2026-09-09 — this gap was NOT its root cause,
  // but was a real, separately-worth-fixing hole found while investigating).
  assert('isOppOrAbove: unmapped stage falls back to closingReason when it names a real funnel stage at/above Opportunity',
    isOppOrAbove('Unrecognized', 'Booking') === true);
  assert('isOppOrAbove: leadClosingReason takes precedence and is checked even when closingReason is blank',
    isOppOrAbove('Unrecognized', '', 'Opportunity') === true);
  assert('isOppOrAbove: a closing reason that is not itself a funnel stage does not falsely trigger the fallback',
    isOppOrAbove('Unrecognized', 'Not Interested') === false);
  assert('isOppOrAbove: no closing reason at all still returns false for an unmapped stage',
    isOppOrAbove('Unrecognized', '', '') === false);
  assert('isOppOrAbove: a correctly-mapped stage is never overridden by an unrelated closing reason',
    isOppOrAbove('Opportunity', 'Not Interested') === true);

  // ---- 2b. RM Performance name-alias fix (2026-09-09) ----
  // Direct, targeted tests for rmPerfCanonicalRmName plus the actual bug
  // it fixes: two spellings of the SAME real person merging into one RM
  // group instead of silently splitting. High stakes (this feeds a real
  // "who needs coaching" judgment about real people) — verified here
  // with a real synthetic dataset proving the merge actually happens,
  // not just that the pure function returns the right string.
  assert('rmPerfCanonicalRmName: a known alias resolves to its canonical spelling',
    rmPerfCanonicalRmName('Akash Ugale') === 'Akash A Ugale');
  assert('rmPerfCanonicalRmName: the canonical spelling itself passes through unchanged',
    rmPerfCanonicalRmName('Akash A Ugale') === 'Akash A Ugale');
  assert('rmPerfCanonicalRmName: case/whitespace-insensitive lookup',
    rmPerfCanonicalRmName('  akash ugale  ') === 'Akash A Ugale');
  assert('rmPerfCanonicalRmName: an unaliased name passes through unchanged (the vast majority of RMs)',
    rmPerfCanonicalRmName('Totally Unrelated Name') === 'Totally Unrelated Name');
  assert('rmPerfCanonicalRmName: blank input does not throw, returns blank',
    rmPerfCanonicalRmName('') === '');

  // Real integration proof: 3 distinct leads under "Akash Ugale", 3 more
  // under "Akash A Ugale". Individually each spelling has only 3 distinct
  // eligible leads — below RM_PERF_MIN_VOLUME_LEADS (5), so it would read
  // as "Insufficient Data" on its own, hiding whatever pattern is really
  // there. Combined, the same person has 6, comfortably over the
  // threshold. If the merge is broken, this person never appears as one
  // real, rankable row — exactly the silent-split bug this fix closes.
  (function () {
    const anchor = new Date('2026-09-01T18:00:00+05:30');
    function aliasSnapshot(rmName, leadId, daysAgoAssigned) {
      return {
        snapshot_at: anchor, snapshot_label: 'alias test', lead_id: leadId, client_id: 'C-' + leadId,
        RM: rmName, TL: 'Test TL', project: 'Test Project', region: 'Test Region', client: 'Test Client',
        lead_assigned_at: new Date(anchor.getTime() - daysAgoAssigned * 86400000).toISOString(),
        group_source: 'Google', source_bucket: 'PPC', current_stage: 'Suspect',
        last_connect: '', last_connect_time: '', last_comment: '', internal_status_comments: '', stage_comments: '',
        closing_reason: '', call_attempts: 0, call_count: 0, duration: 0, rm_is_active: true, lead_closing_reason: '',
      };
    }
    const saved = movementSnapshots;
    movementSnapshots = [
      aliasSnapshot('Akash Ugale', 'ALIAS-1', 3), aliasSnapshot('Akash Ugale', 'ALIAS-2', 3), aliasSnapshot('Akash Ugale', 'ALIAS-3', 3),
      aliasSnapshot('Akash A Ugale', 'ALIAS-4', 3), aliasSnapshot('Akash A Ugale', 'ALIAS-5', 3), aliasSnapshot('Akash A Ugale', 'ALIAS-6', 3),
    ];
    const emptyFilters = { project: new Set(), region: new Set(), TL: new Set(), source: new Set(), bucket: new Set() };
    let result;
    try {
      result = computeRmPerformance(null, undefined, emptyFilters, null);
    } finally {
      movementSnapshots = saved; // restore before any other test/render touches it
    }
    const akashEntries = result.filter(r => r.name === 'Akash A Ugale' || r.name === 'Akash Ugale');
    assert('RM Performance alias fix: exactly one row for this person, not split across two spellings',
      akashEntries.length === 1, 'found ' + akashEntries.length + ' row(s): ' + akashEntries.map(r => r.name).join(', '));
    assert('RM Performance alias fix: the merged row uses the canonical spelling',
      !!akashEntries[0] && akashEntries[0].name === 'Akash A Ugale');
    assert('RM Performance alias fix: distinctLeads reflects the COMBINED total (6), not either half alone (3)',
      !!akashEntries[0] && akashEntries[0].distinctLeads === 6, 'distinctLeads=' + (akashEntries[0] && akashEntries[0].distinctLeads));
    assert('RM Performance alias fix: combined volume clears Insufficient Data (each half alone would not)',
      !!akashEntries[0] && akashEntries[0].classification !== 'Insufficient Data', 'classification=' + (akashEntries[0] && akashEntries[0].classification));
  })();

  // ---- 2c. Region wise repeat offender list: ADDITIONAL per-region worst-5
  // RM tables (2026-09-09) ----
  // Explicit correction, same day: the FIRST attempt at this task capped
  // the existing "By Region" table (which ranks regions against each
  // other) at 5 -- wrong, reverted. What was actually wanted: a NEW,
  // separate breakdown, one small table PER region, each showing that
  // region's own worst 5 RMs -- the 4 original tables (RM/Region/A1-TM/RH)
  // stay completely untouched. computeRmPerformanceByRegion
  // (core-rm-performance.js) is the function under test here.
  (function () {
    const anchor = new Date('2026-09-01T18:00:00+05:30');
    // 10h before the snapshot -- past LEAD_GRACE_HOURS_ but comfortably
    // under the 48h stageStuck48h threshold (stageStuck48h = past48h &&
    // pastGrace, core-lead-model.js -- PURELY age-based, no stage/connect
    // check at all). A 3-day-old lead_assigned_at (this file's OWN alias-
    // fix fixture above uses exactly that) would make EVERY row here,
    // "clean" ones included, also violate stageStuck48h regardless of
    // stage -- silently contaminating the "clean" fixture below and
    // exactly matching the real incident Tests_DailyRmIssueLog.gs's own
    // rmPerfLeadAssignedAt_ comment already documents on the .gs side.
    const oldAssigned = new Date(anchor.getTime() - 10 * 3600000).toISOString();
    function regionBadRow(regionName, rmName, leadId) {
      return {
        snapshot_at: anchor, snapshot_label: 'region test', lead_id: leadId, client_id: 'C-' + leadId,
        RM: rmName, TL: 'Test TL', project: 'Test Project', region: regionName, client: 'Test Client',
        lead_assigned_at: oldAssigned, group_source: 'Google', source_bucket: 'PPC', current_stage: 'Suspect',
        last_connect: '', last_connect_time: '', last_comment: '', internal_status_comments: '', stage_comments: '',
        closing_reason: '', call_attempts: 0, call_count: 0, duration: 0, rm_is_active: true, lead_closing_reason: '',
      };
    }
    function regionCleanRow(regionName, rmName, leadId) {
      return {
        snapshot_at: anchor, snapshot_label: 'region test', lead_id: leadId, client_id: 'C-' + leadId,
        RM: rmName, TL: 'Test TL', project: 'Test Project', region: regionName, client: 'Test Client',
        lead_assigned_at: oldAssigned, group_source: 'Google', source_bucket: 'PPC', current_stage: 'Connected',
        last_connect: 'Connected', last_connect_time: new Date(anchor.getTime() - 3600000).toISOString(),
        last_comment: 'ok', internal_status_comments: 'RM: call 1 - 2026-09-01 09:00', stage_comments: '',
        closing_reason: '', call_attempts: 10, call_count: 10, duration: 0, rm_is_active: true, lead_closing_reason: '',
      };
    }
    const saved = movementSnapshots;
    const snaps = [];
    // RegionCap: 8 distinct RMs, all 100% violated (5 leads each) -- proves
    // the per-region cap actually applies (worst 5, not all 8) and that
    // rows are correctly partitioned to their own region (no cross-region
    // leakage into a table that should only ever show RegionCap RMs).
    for (let rmN = 1; rmN <= 8; rmN++) {
      for (let leadN = 1; leadN <= 5; leadN++) snaps.push(regionBadRow('RegionCap', 'Cap-RM' + rmN, 'CAP-' + rmN + '-' + leadN));
    }
    // RegionHigh: 5 RMs, ALL equally 100% violated -- every RM's own rate
    // equals the peer average, so NONE should read as unusually bad
    // relative to their (equally bad) regional peers.
    for (let rmN = 1; rmN <= 5; rmN++) {
      for (let leadN = 1; leadN <= 5; leadN++) snaps.push(regionBadRow('RegionHigh', 'High-RM' + rmN, 'HIGH-' + rmN + '-' + leadN));
    }
    // RegionLow: 1 RM at 60% violated (3 bad + 2 clean leads) alongside 4
    // fully-clean peer RMs -- the region's OWN peer average is near zero,
    // so this one RM should read as clearly flagged relative to its
    // (mostly clean) regional peers -- the opposite outcome from an
    // identically-behaved RM in RegionHigh, proving the peer baseline is
    // genuinely region-scoped, not a shared/global one.
    for (let leadN = 1; leadN <= 3; leadN++) snaps.push(regionBadRow('RegionLow', 'Low-MidBad', 'LOWBAD-' + leadN));
    for (let leadN = 4; leadN <= 5; leadN++) snaps.push(regionCleanRow('RegionLow', 'Low-MidBad', 'LOWBAD-' + leadN));
    for (let rmN = 1; rmN <= 4; rmN++) {
      for (let leadN = 1; leadN <= 5; leadN++) snaps.push(regionCleanRow('RegionLow', 'Low-Clean' + rmN, 'LOWCLEAN-' + rmN + '-' + leadN));
    }
    movementSnapshots = snaps;
    const emptyFilters = { project: new Set(), region: new Set(), TL: new Set(), source: new Set(), bucket: new Set() };
    let byRegion;
    try {
      byRegion = computeRmPerformanceByRegion(null, emptyFilters, null);
    } finally {
      movementSnapshots = saved;
    }
    const byRegionMap = {}; byRegion.forEach(entry => { byRegionMap[entry.region] = entry; });

    assert('Region wise repeat offender list: RegionCap\'s table is capped at 5 RMs, not all 8',
      !!byRegionMap.RegionCap && byRegionMap.RegionCap.list.length === 5,
      'length=' + (byRegionMap.RegionCap && byRegionMap.RegionCap.list.length));
    assert('Region wise repeat offender list: RegionCap\'s rows are all actually Cap-RM* (no cross-region leakage)',
      !!byRegionMap.RegionCap && byRegionMap.RegionCap.list.every(r => r.name.indexOf('Cap-RM') === 0));
    assert('Region wise repeat offender list: RegionHigh (5 equally-bad RMs) has no rows flagged Below Expectations relative to their own equally-bad peers',
      !!byRegionMap.RegionHigh && byRegionMap.RegionHigh.list.every(r => r.classification !== 'Below Expectations'),
      'classifications=' + (byRegionMap.RegionHigh && byRegionMap.RegionHigh.list.map(r => r.classification).join(',')));
    const lowMidBad = byRegionMap.RegionLow && byRegionMap.RegionLow.list.find(r => r.name === 'Low-MidBad');
    assert('Region wise repeat offender list: RegionLow\'s Low-MidBad (60% violated among mostly-clean peers) IS flagged relative to its own region\'s low peer average',
      !!lowMidBad && lowMidBad.classification !== 'On Track' && lowMidBad.classification !== 'Insufficient Data',
      'classification=' + (lowMidBad && lowMidBad.classification));
    const highSample = byRegionMap.RegionHigh && byRegionMap.RegionHigh.list[0];
    assert('Region wise repeat offender list: peer baseline is genuinely region-scoped, not shared -- RegionHigh\'s peerComposite is materially higher than RegionLow\'s (its peers are mostly clean, RegionHigh\'s peers are all 100% violated)',
      !!highSample && !!lowMidBad && highSample.peerComposite > lowMidBad.peerComposite * 1.3,
      'RegionHigh peerComposite=' + (highSample && highSample.peerComposite) + ', RegionLow peerComposite=' + (lowMidBad && lowMidBad.peerComposite));
  })();

  // ---- 2d. rmPerfIsLeadershipExcluded: A1/TM/RH/CH-tier roles, not just
  // Cluster Head (2026-09-09) ----
  // Explicit request, found while reviewing the new per-region tables:
  // "you are also including A1/TM, RH, CH and leadership -- RM means
  // those not A1/TM, RH, CH or in leadership". Root cause: the exclusion
  // only ever checked role === 'Cluster Head' -- a genuine Team Lead (A1)
  // or Team Manager (TM) personally holding a lead (a real, documented
  // occurrence -- see RmHierarchy.gs's resolveRecipientBucketsForRms_)
  // ranked right alongside real RMs in every rollup, including the
  // per-region worst-5 tables above. High stakes: this ranking feeds a
  // real "who needs coaching" judgment -- a manager should never be
  // mistaken for the RM being coached.
  assert('rmPerfIsLeadershipExcluded: an A1 (Team Lead) is excluded, not just Cluster Head',
    rmPerfIsLeadershipExcluded('Test A1 Person', new Map([['test a1 person', { role: 'A1' }]])) === true);
  assert('rmPerfIsLeadershipExcluded: a TM (Team Manager) is excluded',
    rmPerfIsLeadershipExcluded('Test TM Person', new Map([['test tm person', { role: 'TM' }]])) === true);
  assert('rmPerfIsLeadershipExcluded: an RH (Regional Head) is excluded',
    rmPerfIsLeadershipExcluded('Test RH Person', new Map([['test rh person', { role: 'RH' }]])) === true);
  assert('rmPerfIsLeadershipExcluded: a City Lead is excluded (not just the literal string "Cluster Head")',
    rmPerfIsLeadershipExcluded('Test City Lead', new Map([['test city lead', { role: 'City Lead' }]])) === true);
  assert('rmPerfIsLeadershipExcluded: a Commercial Head is excluded',
    rmPerfIsLeadershipExcluded('Test Comm Head', new Map([['test comm head', { role: 'Commercial Head' }]])) === true);
  assert('rmPerfIsLeadershipExcluded: role match is case-insensitive (real data may vary casing)',
    rmPerfIsLeadershipExcluded('Test A1 Lower', new Map([['test a1 lower', { role: 'a1' }]])) === true);
  assert('rmPerfIsLeadershipExcluded: a genuine front-line S1 RM is NOT excluded',
    rmPerfIsLeadershipExcluded('Test S1 RM', new Map([['test s1 rm', { role: 'S1' }]])) === false);
  assert('rmPerfIsLeadershipExcluded: a Loan-vertical BDM is NOT excluded (front-line, not management)',
    rmPerfIsLeadershipExcluded('Test BDM', new Map([['test bdm', { role: 'BDM' }]])) === false);

  // ---- 2d-2. rmPerfIsLeadershipExcluded: vendor (Futwork) + admin
  // (Snehil Chhimwal) exclusions (2026-09-29) ----
  // Explicit request: "remove agents that have 'futwork' in their name
  // from list, also remove Snehil Chhimwal from list". Both are excluded
  // ENTIRELY (Stage 1, same as leadership), not merely hidden -- so
  // neither can inflate a peer average or a region's distinctRMs count.
  assert('rmPerfIsLeadershipExcluded: a Futwork vendor agent is excluded (name contains "Futwork")',
    rmPerfIsLeadershipExcluded('Futwork Agent 12', null) === true);
  assert('rmPerfIsLeadershipExcluded: Futwork match is case-insensitive (real data may vary casing)',
    rmPerfIsLeadershipExcluded('FUTWORK Agent Lower', null) === true);
  assert('rmPerfIsLeadershipExcluded: "Futwork" mid-string still matches (not anchored to the start)',
    rmPerfIsLeadershipExcluded('Team Futwork Caller 3', null) === true);
  assert('rmPerfIsLeadershipExcluded: the account holder/admin "Snehil Chhimwal" is excluded',
    rmPerfIsLeadershipExcluded('Snehil Chhimwal', null) === true);
  assert('rmPerfIsLeadershipExcluded: a genuine front-line RM whose name merely contains neither pattern is NOT excluded',
    rmPerfIsLeadershipExcluded('Ramesh Kumar', null) === false);

  // Real integration proof, mirroring the alias-fix test's own pattern:
  // a mixed dataset (2 genuine RMs + 1 A1 + 1 RH, each with their own
  // distinct leads) run through the SAME computeRmPerformance/
  // computeRmPerformanceByRegion pipeline the live tables actually call --
  // proves the manager/leadership rows never reach either result, not
  // just that the pure predicate function returns the right boolean.
  (function () {
    const anchor = new Date('2026-09-01T18:00:00+05:30');
    const oldAssigned = new Date(anchor.getTime() - 10 * 3600000).toISOString();
    function row(regionName, rmName, leadId) {
      return { snapshot_at: anchor, snapshot_label: 'leadership excl test', lead_id: leadId, client_id: 'C-' + leadId,
        RM: rmName, TL: 'Test TL', project: 'Test Project', region: regionName, client: 'Test Client',
        lead_assigned_at: oldAssigned, group_source: 'Google', source_bucket: 'PPC', current_stage: 'Suspect',
        last_connect: '', last_connect_time: '', last_comment: '', internal_status_comments: '', stage_comments: '',
        closing_reason: '', call_attempts: 0, call_count: 0, duration: 0, rm_is_active: true, lead_closing_reason: '' };
    }
    const saved = movementSnapshots;
    const snaps = [];
    ['Real-RM1', 'Real-RM2'].forEach(rm => { for (let i = 1; i <= 5; i++) snaps.push(row('LeadExclRegion', rm, rm + '-' + i)); });
    for (let i = 1; i <= 5; i++) snaps.push(row('LeadExclRegion', 'Team-A1', 'A1-' + i));
    for (let i = 1; i <= 5; i++) snaps.push(row('LeadExclRegion', 'Region-RH', 'RH-' + i));
    movementSnapshots = snaps;
    const rmHierarchy = new Map([
      ['team-a1', { name: 'Team-A1', role: 'A1', tl: '', tm: '', rh: '', ch: '' }],
      ['region-rh', { name: 'Region-RH', role: 'RH', tl: '', tm: '', rh: '', ch: '' }],
    ]);
    const emptyFilters = { project: new Set(), region: new Set(), TL: new Set(), source: new Set(), bucket: new Set() };
    let rmLevel, byRegion;
    try {
      rmLevel = computeRmPerformance(null, undefined, emptyFilters, rmHierarchy);
      byRegion = computeRmPerformanceByRegion(null, emptyFilters, rmHierarchy);
    } finally {
      movementSnapshots = saved;
    }
    const rmNames = rmLevel.map(r => r.name);
    assert('Leadership exclusion integration: the RM-level table includes both real RMs',
      rmNames.indexOf('Real-RM1') !== -1 && rmNames.indexOf('Real-RM2') !== -1);

  // ---- 2e. downloadRepeatOffendersPdf: waits for RM_Hierarchy, not just

  // ---- 2f. Repeat Offenders Architecture Redesign — regression suite

  function _roFilterTestRow(overrides) {

      closing_reason: '', call_attempts: 0, call_count: 0, duration: 0, rm_is_active: true, lead_closing_reason: '',
    };
    return Object.assign({}, defaults, overrides || {});
  }
  const _roEmptyFilters = () => ({ project: new Set(), region: new Set(), TL: new Set(), source: new Set(), bucket: new Set() });

  // 1. Source filter alone.
  (function () {
    const saved = movementSnapshots;
    movementSnapshots = [
      _roFilterTestRow({ lead_id: 'SRC-G1', client_id: 'C-SRC-G1', group_source: 'Google' }),
      _roFilterTestRow({ lead_id: 'SRC-G2', client_id: 'C-SRC-G2', group_source: 'Google' }),
      _roFilterTestRow({ lead_id: 'SRC-F1', client_id: 'C-SRC-F1', group_source: 'Facebook' }),

    try {
      const googleFilters = Object.assign(_roEmptyFilters(), { source: new Set(['Google']) });
      withGoogle = computeRmPerformance(null, undefined, googleFilters, null);
      withNone = computeRmPerformance(null, undefined, _roEmptyFilters(), null);
    } finally { movementSnapshots = saved; }
    const g = withGoogle.find(r => r.name === 'FilterTest RM');
    const all = withNone.find(r => r.name === 'FilterTest RM');
    assert('Source filter alone: filtering to Google reduces Unique Leads to only the 2 Google leads',
      !!g && g.distinctLeads === 2, 'distinctLeads=' + (g && g.distinctLeads));
    assert('Source filter alone: no filter includes all 3 leads (2 Google + 1 Facebook)',
      !!all && all.distinctLeads === 3, 'distinctLeads=' + (all && all.distinctLeads));
  })();

  // 2. Sub-source filter alone.
  (function () {
    const saved = movementSnapshots;

      _roFilterTestRow({ lead_id: 'SUB-P1', client_id: 'C-SUB-P1', source_bucket: 'PPC' }),

    ];

    try {

    assert('Sub-source filter alone: filtering to PPC reduces Unique Leads to only the 2 PPC leads',
      !!p && p.distinctLeads === 2, 'distinctLeads=' + (p && p.distinctLeads));
  })();

  // 3. Multiple filters together (Region + Source) — AND, not OR.

  // 4. A lead with multiple Movement_Log copies (same client_id, two

  // 5. A lead whose raw records span multiple source_bucket values
  // across different captured days (Part 2 Rule 5) — filtering is
  // per-record, not a one-time per-lead gate.
  (function () {
    const day1 = new Date('2026-09-01T06:00:00+05:30');

  // 6. A filter combination producing zero results.
  (function () {
    const saved = movementSnapshots;
    movementSnapshots = [_roFilterTestRow({ lead_id: 'ZERO-1', client_id: 'C-ZERO-1' })];

  // Shared fixture for tests 7-11 — enough distinct leads (>=
  // RM_PERF_MIN_VOLUME_LEADS) to actually rank and render, going through
  // the REAL async UI pipeline (renderRepeatOffenders/

  // these tests are specifically about the cache/race mechanism, not the
  // calculation itself.
  function _roCacheTestFixture(rmName, n) {
    const anchor = new Date();

      rows.push(_roFilterTestRow({
        lead_id: rmName + '-' + i, client_id: 'C-' + rmName + '-' + i, RM: rmName,
        snapshot_at: anchor, lead_assigned_at: new Date(anchor.getTime() - 10 * 3600000).toISOString(),
      }));

  }
  async function _roWaitForCache(deadlineMs) {
    const deadline = Date.now() + (deadlineMs || 5000);
    while (!_repeatOffendersLastResult && Date.now() < deadline) await new Promise(r => setTimeout(r, 25));
  }

  // 7. PDF export attempted while a recalculation is in flight (state 2).
  await (async function () {
    const savedSnapshots = movementSnapshots, savedFetch = movementFetchState, savedHier = rmHierarchyFetchState;
    const savedRunId = _repeatOffendersRunId, savedLastResult = _repeatOffendersLastResult;

      // Simulate "a newer run is in flight" deterministically, rather

        !!statusEl && statusEl.textContent.indexOf('Still recalculating') !== -1,

  // 8. PDF export before any calculation has ever completed (state 1).

  // this is specifically the "data is fine, but no Repeat Offenders
  // calculation has run yet" state, distinct from the already-covered
  // "Movement_Log itself hasn't loaded" guard above it.
  await (async function () {
    const savedSnapshots = movementSnapshots, savedFetch = movementFetchState, savedHier = rmHierarchyFetchState;
    const savedLastResult = _repeatOffendersLastResult;
    const statusEl = document.getElementById('repeatOffendersPdfStatus');

  // 9. PDF values match the screen exactly, for the same completed

  // explicitly. Compares the DOM's own rendered row against the row
  // _repeatOffendersPdfSectionTables/_repeatOffendersPdfTableRows build

  await (async function () {
    const savedSnapshots = movementSnapshots, savedFetch = movementFetchState, savedHier = rmHierarchyFetchState;
    const savedLastResult = _repeatOffendersLastResult;

      const domScoreText = domRow ? domRow.querySelectorAll('td')[4].textContent.replace(/\s+/g, ' ').trim() : null;
      const pdfTableRow = pdfRow ? _repeatOffendersPdfTableRows([pdfRow], null)[0] : null;
      assert('PDF values match the screen exactly: Score string built for the PDF matches the composite/peerComposite the DOM rendered from',
        !!pdfTableRow && domScoreText.indexOf(pdfRow.composite.toFixed(2)) !== -1 && domScoreText.indexOf(pdfRow.peerComposite.toFixed(2)) !== -1,

  // 10. A filter changes again while a previous filter change's

    const savedLastResult = _repeatOffendersLastResult, savedRunId = _repeatOffendersRunId;
    const rangeSel = document.getElementById('repeatOffendersRangeSelect');

  // ---- 2g. RM Opp-Conversion join (added 2026-09-29, HANDOVER.md §9.7.3) ----
  // One lead-copy (1+ Movement_Log rows sharing a lead_id) with an explicit
  // assignment time and a sequence of {hOffset (hours after createdAt),
  // stage} snapshots — createdAt real Date, snaps ascending by hOffset (not
  // enforced here; every fixture below already writes them in order).
  function _roOppLead(rmName, leadId, createdAt, snaps) {
    return snaps.map(s => _roFilterTestRow({
      lead_id: leadId, client_id: 'C-' + leadId, RM: rmName,
      lead_assigned_at: createdAt.toISOString(),
      snapshot_at: new Date(createdAt.getTime() + s.hOffset * 3600000),

  // 1. Cohort/lag-guard correctness — a lead whose first snapshot lags its
  // own assignment by more than RM_OPP_MAX_FIRST_CAPTURE_LAG_HOURS (12) is
  // excluded from the cohort entirely (not "included but unresolved") —
  // its evidence says nothing reliable about same-day conversion. A lead
  // still under 48h old counts toward the cohort but as pending, not
  // resolved.
  (function () {
    const createdAt = new Date(Date.now() - 5 * 24 * 3600000); // 5 days ago — old enough for 48h to have elapsed
    const recentCreatedAt = new Date(Date.now() - 10 * 3600000); // 10h ago — well under 48h
    const rows = [
      ..._roOppLead('LagTest RM', 'LAG-OK', createdAt, [{ hOffset: 1, stage: 'Suspect' }]), // 1h lag — within guard
      ..._roOppLead('LagTest RM', 'LAG-TOOLATE', createdAt, [{ hOffset: 20, stage: 'Suspect' }]), // 20h lag — excluded
      ..._roOppLead('LagTest RM', 'LAG-RECENT', recentCreatedAt, [{ hOffset: 1, stage: 'Suspect' }]), // in cohort, not yet 48h
    ];
    const savedSnapshots = movementSnapshots;
    movementSnapshots = rows;
    try {
      const c = reconstructRmOppCohort(null, _roEmptyFilters(), null, Date.now());
      assert('reconstructRmOppCohort: excludes a lead whose first snapshot lagged assignment by >12h',
        c.every(e => e.lead_id !== 'LAG-TOOLATE'), 'cohort lead_ids=' + JSON.stringify(c.map(e => e.lead_id)));
      assert('reconstructRmOppCohort: includes a lead within the 12h lag guard',
        c.some(e => e.lead_id === 'LAG-OK'), 'cohort lead_ids=' + JSON.stringify(c.map(e => e.lead_id)));
      const recent = c.find(e => e.lead_id === 'LAG-RECENT');
      assert('reconstructRmOppCohort: a <48h-old lead is in the cohort but windowComplete=false (pending, not resolved)',
        !!recent && recent.windowComplete === false, 'recent=' + JSON.stringify(recent));
    } finally { movementSnapshots = savedSnapshots; }
  })();

  // 2. Peer-average arithmetic exactly, and the low-conversion threshold
  // actually has teeth — the one test in this section most worth
  // mutation-checking by hand (see HANDOVER.md §9.7.3 for the exact
  // reasoning behind RM_OPP_LOW_RATIO=0.5, not a literal RM_PERF_FLAG_RATIO
  // mirror). All 20 leads created 5 days ago (past their own 48h mark, so
  // the whole table's basis resolves to '48h') — single snapshot each for
  // non-converters (evidenceAtDeadline's firstAfter/atOrBefore fallback
  // still finds real evidence), a second Opportunity-stage snapshot at
  // +40h for converters.
  (function () {
    const createdAt = new Date(Date.now() - 5 * 24 * 3600000);
    const rows = [];
    for (let i = 1; i <= 10; i++) {
      const snaps = i <= 8 // OppGood: 8 of 10 convert
        ? [{ hOffset: 1, stage: 'Suspect' }, { hOffset: 40, stage: 'Opportunity' }]
        : [{ hOffset: 1, stage: 'Suspect' }];
      rows.push(..._roOppLead('OppGood', 'GOOD-' + i, createdAt, snaps));
    }
    for (let i = 1; i <= 10; i++) {
      rows.push(..._roOppLead('OppBad', 'BAD-' + i, createdAt, [{ hOffset: 1, stage: 'Suspect' }])); // 0 of 10 convert
    }
    const savedSnapshots = movementSnapshots;
    movementSnapshots = rows;
    try {
      const cohort = reconstructRmOppCohort(null, _roEmptyFilters(), null, Date.now());
      assert('G2 fixture: cohort has exactly 20 leads (no lag/date exclusions)', cohort.length === 20, 'cohortLength=' + cohort.length);
      const byGroup = aggregateRmOppConversion(cohort, undefined);
      const classified = classifyRmOppConversion(byGroup);
      assert('classifyRmOppConversion: basis resolves to h48 once every lead is past its own 48h mark',
        classified.basis === 'h48', 'basis=' + classified.basis);
      // Pooled peer h48 rate: (8 + 0) opp / (10 + 10) resolved = 0.4 exactly.
      assert('classifyRmOppConversion: pooled peer h48 rate is exactly 8/20 = 0.4 (volume-weighted, not an unweighted mean of the two groups\' own rates)',
        Math.abs(classified.peer.h48 - 0.4) < 1e-9, 'peer.h48=' + classified.peer.h48);
      const good = classified.byName.get('OppGood'), bad = classified.byName.get('OppBad');
      assert('classifyRmOppConversion: OppGood (8/10, well above peer) is NOT lowConversion',
        !!good && good.lowConversion === false, 'good=' + JSON.stringify(good));
      // shrunk = 10/(10+8) * 0 + 8/(10+8) * 0.4 = 8/45 ≈ 0.1778 <= 0.5*0.4=0.2 -> flagged.
      assert('classifyRmOppConversion: OppBad (0/10) IS lowConversion — shrunk rate 8/45≈0.178 <= 0.5×peer(0.4)=0.2',
        !!bad && bad.lowConversion === true, 'bad=' + JSON.stringify(bad));
      assert('classifyRmOppConversion: OppBad\'s shrunk rate matches hand computation (8/45) exactly',
        Math.abs(bad.shrunk - 8 / 45) < 1e-9, 'bad.shrunk=' + bad.shrunk);
    } finally { movementSnapshots = savedSnapshots; }
  })();

  // 3. doubleFlag truth table — requires BOTH an elevated violation
  // classification AND lowConversion; neither alone is enough.
  (function () {
    const oppClassified = { basis: 'h48', peer: { sameDay: 0, h48: 0.4 }, byName: new Map([
      ['Below+Low', { lowConversion: true }], ['Below+NotLow', { lowConversion: false }],
      ['Watch+Low', { lowConversion: true }], ['OnTrack+Low', { lowConversion: true }],
      ['Insufficient+Low', { lowConversion: true }],
    ]) };
    const perfRows = [
      { name: 'Below+Low', classification: 'Below Expectations' },
      { name: 'Below+NotLow', classification: 'Below Expectations' },
      { name: 'Watch+Low', classification: 'Watch — concentrated' },
      { name: 'OnTrack+Low', classification: 'On Track' },
      { name: 'Insufficient+Low', classification: 'Insufficient Data' },
      { name: 'NoOppData', classification: 'Below Expectations' }, // not in byName at all
    ];
    const joined = joinRmOppConversion(perfRows, oppClassified);
    const flagOf = name => joined.find(r => r.name === name).doubleFlag;
    assert('joinRmOppConversion: Below Expectations + lowConversion -> doubleFlag true', flagOf('Below+Low') === true);
    assert('joinRmOppConversion: Below Expectations + NOT lowConversion -> doubleFlag false', flagOf('Below+NotLow') === false);
    assert('joinRmOppConversion: Watch — concentrated + lowConversion -> doubleFlag true', flagOf('Watch+Low') === true);
    assert('joinRmOppConversion: On Track + lowConversion -> doubleFlag false (violation side not elevated)', flagOf('OnTrack+Low') === false);
    assert('joinRmOppConversion: Insufficient Data + lowConversion -> doubleFlag false (never flagged regardless)', flagOf('Insufficient+Low') === false);
    assert('joinRmOppConversion: a row with no matching Opp entry gets opp:null, doubleFlag false, never guessed',
      joined.find(r => r.name === 'NoOppData').opp === null && flagOf('NoOppData') === false);
    assert('joinRmOppConversion: every existing field is copied through unchanged',
      joined[0].classification === perfRows[0].classification);
  })();

  // 4. Same Project/Region/TL/Source/Sub-source filter produces the same
  // population on both the violation engine and the conversion cohort —
  // the one requirement this whole design exists to satisfy. Fixture
  // deliberately single-snapshot-per-lead, single-day, so "eligible
  // lead-days observed in range" (violation side) and "leads assigned in
  // range" (conversion side) collapse onto the exact same 3 leads for
  // this narrow case — NOT a general claim that the two counts always
  // match (they measure different things by design, see
  // core-rm-performance.js's own header comment), just that the SAME
  // filter predicate excludes the SAME records on both sides.
  (function () {
    const createdAt = new Date(Date.now() - 10 * 3600000); // 10h ago (lead_assigned_at)
    const rows = [
      // hOffset:4 — 4h after assignment: past CONFIG.LEAD_GRACE_HOURS (3h,
      // so the violation engine's pastGrace-gated rules are eligible) and
      // within the 12h lag guard (so the cohort includes it too).
      ..._roOppLead('FilterJoin RM', 'FJ-G1', createdAt, [{ hOffset: 4, stage: 'Suspect' }]).map(r => Object.assign(r, { group_source: 'Google', source_bucket: 'UTM' })),
      ..._roOppLead('FilterJoin RM', 'FJ-G2', createdAt, [{ hOffset: 4, stage: 'Suspect' }]).map(r => Object.assign(r, { group_source: 'Google', source_bucket: 'Search' })),
      ..._roOppLead('FilterJoin RM', 'FJ-G3', createdAt, [{ hOffset: 4, stage: 'Suspect' }]).map(r => Object.assign(r, { group_source: 'Google', source_bucket: 'Non-UTM' })),
      ..._roOppLead('FilterJoin RM', 'FJ-F1', createdAt, [{ hOffset: 4, stage: 'Suspect' }]).map(r => Object.assign(r, { group_source: 'Facebook', source_bucket: 'UTM' })),
    ];
    const savedSnapshots = movementSnapshots;
    movementSnapshots = rows;
    try {
      const filters = Object.assign(_roEmptyFilters(), { source: new Set(['Google']) });
      const perf = computeRmPerformance(null, undefined, filters, null);
      const row = perf.find(r => r.name === 'FilterJoin RM');
      const cohort = reconstructRmOppCohort(null, filters, null, Date.now());
      assert('Same Source=Google filter: violation engine sees exactly 3 eligible leads (the 3 Google leads; Facebook excluded)',
        !!row && row.distinctLeads === 3, 'distinctLeads=' + (row && row.distinctLeads));
      assert('Same Source=Google filter: conversion cohort sees exactly the same 3 leads',
        cohort.length === 3 && cohort.every(e => e.rec.group_source === 'Google'), 'cohortLength=' + cohort.length);
      const bucketFilters = Object.assign(_roEmptyFilters(), { source: new Set(['Google']), bucket: new Set(['UTM', 'Search']) });
      const cohortUtmSearch = reconstructRmOppCohort(null, bucketFilters, null, Date.now());
      assert('Source=Google + Sub-source=UTM,Search: conversion cohort correctly narrows to 2 (excludes the Non-UTM one)',
        cohortUtmSearch.length === 2, 'cohortLength=' + cohortUtmSearch.length);
    } finally { movementSnapshots = savedSnapshots; }
  })();

  // 5. No regression — every field classifyRmPerformance already produced
  // is copied through computeRmPerformanceWithOpp unchanged (the "parallel
  // signal, not a 5th tier" decision, HANDOVER.md §9.7.3).
  (function () {
    const createdAt = new Date(Date.now() - 5 * 24 * 3600000);
    const rows = [];
    // hOffset:4 — past the 3h grace, so this RM has real, nonzero
    // eligible/violation data (distinctLeads>0), not a trivial 0===0
    // equality check.
    for (let i = 1; i <= 6; i++) rows.push(..._roOppLead('Regression RM', 'REG-' + i, createdAt, [{ hOffset: 4, stage: 'Suspect' }]));
    const savedSnapshots = movementSnapshots;
    movementSnapshots = rows;
    try {
      const filters = _roEmptyFilters();
      const plain = computeRmPerformance(null, undefined, filters, null).find(r => r.name === 'Regression RM');
      const cohort = reconstructRmOppCohort(null, filters, null, Date.now());
      const joined = computeRmPerformanceWithOpp(null, undefined, filters, null, cohort).find(r => r.name === 'Regression RM');
      assert('Regression fixture: distinctLeads is genuinely nonzero (this test actually exercises real data, not two empty results agreeing trivially)',
        !!plain && plain.distinctLeads > 0, 'plain.distinctLeads=' + (plain && plain.distinctLeads));
      ['name', 'composite', 'peerComposite', 'classification', 'distinctLeads', 'totalInstances', 'routingIssueDays'].forEach(k => {
        assert('computeRmPerformanceWithOpp: field "' + k + '" is byte-identical to plain computeRmPerformance',
          JSON.stringify(joined[k]) === JSON.stringify(plain[k]), k + ': joined=' + JSON.stringify(joined[k]) + ' plain=' + JSON.stringify(plain[k]));
      });
      assert('computeRmPerformanceWithOpp: adds opp/oppBasis/oppPeer/doubleFlag on top, not instead',
        joined.opp !== undefined && joined.oppBasis !== undefined && joined.oppPeer !== undefined && typeof joined.doubleFlag === 'boolean');
    } finally { movementSnapshots = savedSnapshots; }
  })();

  // 6. Region-restricted conversion peers — computeRmPerformanceByRegion's
  // opts.oppCohort must compute each region's Opp-conversion peer average
  // against ONLY that region's own RMs, same as the violation side already
  // does (repeatOffendersRegionKey-restricted keyFn, reused for both).
  (function () {
    const createdAt = new Date(Date.now() - 5 * 24 * 3600000);
    const rows = [];
    // RegionHigh: 2 RMs, both converting 4/5 (80%).
    ['RH-RM1', 'RH-RM2'].forEach(rm => {
      for (let i = 1; i <= 5; i++) {
        const snaps = i <= 4 ? [{ hOffset: 1, stage: 'Suspect' }, { hOffset: 40, stage: 'Opportunity' }] : [{ hOffset: 1, stage: 'Suspect' }];
        rows.push(..._roOppLead(rm, rm + '-' + i, createdAt, snaps).map(r => Object.assign(r, { region: 'RegionHigh' })));
      }
    });
    // RegionLow: 2 RMs, both converting 1/5 (20%).
    ['RL-RM1', 'RL-RM2'].forEach(rm => {
      for (let i = 1; i <= 5; i++) {
        const snaps = i <= 1 ? [{ hOffset: 1, stage: 'Suspect' }, { hOffset: 40, stage: 'Opportunity' }] : [{ hOffset: 1, stage: 'Suspect' }];
        rows.push(..._roOppLead(rm, rm + '-' + i, createdAt, snaps).map(r => Object.assign(r, { region: 'RegionLow' })));
      }
    });
    const savedSnapshots = movementSnapshots;
    movementSnapshots = rows;
    try {
      const filters = _roEmptyFilters();
      const cohort = reconstructRmOppCohort(null, filters, null, Date.now());
      const byRegion = computeRmPerformanceByRegion(null, filters, null, { oppCohort: cohort });
      const high = byRegion.find(e => e.region === 'RegionHigh');
      const low = byRegion.find(e => e.region === 'RegionLow');
      assert('computeRmPerformanceByRegion opts.oppCohort: RegionHigh\'s own peer h48 is 0.8 (its own 2 RMs only, not company-wide)',
        !!high && high.list.length && Math.abs(high.list[0].oppPeer.h48 - 0.8) < 1e-9, 'high peer=' + (high && high.list[0] && high.list[0].oppPeer.h48));
      assert('computeRmPerformanceByRegion opts.oppCohort: RegionLow\'s own peer h48 is 0.2, independently of RegionHigh\'s',
        !!low && low.list.length && Math.abs(low.list[0].oppPeer.h48 - 0.2) < 1e-9, 'low peer=' + (low && low.list[0] && low.list[0].oppPeer.h48));
      assert('computeRmPerformanceByRegion: omitting opts still returns rows with no opp field at all (backward compatible)',
        computeRmPerformanceByRegion(null, filters, null).every(e => e.list.every(r => r.opp === undefined)));
    } finally { movementSnapshots = savedSnapshots; }
  })();

  // 7. Real Worker path: nowMs must be threaded through explicitly, since
  // the Worker runs on its OWN real wall clock and never sees the harness's
  // frozen Date (HANDOVER.md §9.7.3, verified during planning). A lead
  // created exactly "now" (frozen, 2026-09-09) must read as pending48h —
  // if the Worker silently fell back to its own real Date.now() (today's
  // actual date, ~3 weeks later), this same lead would incorrectly read
  // as 48h-resolved instead. Also confirms the rendered DOM has the new
  // columns with no undefined/NaN.
  await (async function () {
    const savedSnapshots = movementSnapshots, savedFetch = movementFetchState, savedHier = rmHierarchyFetchState;
    const savedLastResult = _repeatOffendersLastResult;
    const rangeSel = document.getElementById('repeatOffendersRangeSelect');
    const savedRange = rangeSel ? rangeSel.value : null;
    try {
      if (rangeSel) rangeSel.value = 'allTime';
      movementFetchState = 'ok'; rmHierarchyFetchState = 'missing';
      const createdAt = new Date(); // frozen "now" itself — 0h old, nowhere near 48h
      movementSnapshots = _roOppLead('WorkerNow RM', 'WN-1', createdAt, [{ hOffset: 0, stage: 'Suspect' }])
        .concat(_roCacheTestFixture('WorkerNow RM', 5)); // pad past RM_PERF_MIN_VOLUME_LEADS so it actually classifies
      _repeatOffendersLastResult = null;
      renderRepeatOffenders();
      await _roWaitForCache();
      const cached = _repeatOffendersLastResult;
      const row = cached && cached.rm && cached.rm.find(r => r.name === 'WorkerNow RM');
      assert('Real Worker path: nowMs was passed through correctly — a lead created at the frozen "now" reads as NOT 48h-resolved (pending), proving the Worker did not fall back to its own real wall clock',
        !!row && !!row.opp && row.opp.pending48h >= 1, 'row.opp=' + JSON.stringify(row && row.opp));
      const bodyEl = document.getElementById('repeatOffendersBody');
      const html = bodyEl ? bodyEl.innerHTML : '';
      assert('Real Worker path: rendered Repeat Offenders body contains no undefined/NaN after the Opp-conversion join',
        !/undefined|NaN/.test(html), 'contains undefined/NaN: ' + /undefined|NaN/.test(html));
    } finally {
      movementSnapshots = savedSnapshots; movementFetchState = savedFetch; rmHierarchyFetchState = savedHier;
      _repeatOffendersLastResult = savedLastResult;
      if (rangeSel && savedRange !== null) rangeSel.value = savedRange;
    }
  })();

  // ---- 2h. Posterior-confidence flagging (added 2026-09-30, HANDOVER.md
  // §9.7.5) ----
  // Investigating why a narrow filter (Source=Google + Sub-source=Non-UTM/
  // Search) showed ZERO RMs "Below Expectations" surfaced a real gap: the
  // composite score is already a Bayesian-shrinkage posterior MEAN, but
  // classification only ever compared that mean to a fixed ratio — at
  // small n the shrinkage weight pulls the mean back toward peer
  // regardless of how extreme the evidence is. The fix computes the
  // posterior's VARIANCE too and flags on confidence (a z-score through a
  // normal-CDF approximation) instead of the raw point estimate.
  //
  // Every fixture below was tuned empirically against the REAL running
  // engine (not hand-derived) — the 4 scored rules have different
  // weights AND different eligibility gates (stageStuck48h and
  // followupOverdue are mutually exclusive by lead age; isNotUpdated
  // keys off canonicalStage; underCalledToday off call_attempts), so a
  // pure pen-and-paper composite/variance calculation would be fragile.
  // These exact fixture shapes/counts reproduce specific, comfortably-
  // separated (not razor-thin) confidence values against real code —
  // change any of them and re-verify against the real engine before
  // trusting new numbers.
  function _confBadRow(rmName, leadId) {
    // "Connected but neglected" — Suspect stage (isNotUpdated violated),
    // marked Connected 6h ago with no comments since (followupOverdue
    // violated, >4h stale), zero calls (underCalledToday violated). NOT
    // past48h, so stageStuck48h is deliberately not in play (mutually
    // exclusive with followupOverdue by age — see file header above).
    return _roFilterTestRow({
      lead_id: leadId, client_id: 'C-' + leadId, RM: rmName,
      last_connect: 'Connected',
      last_connect_time: new Date(new Date('2026-09-01T18:00:00+05:30').getTime() - 6 * 3600000).toISOString(),
    });
  }
  function _confCleanRow(rmName, leadId) {
    return _roFilterTestRow({
      lead_id: leadId, client_id: 'C-' + leadId, RM: rmName,
      current_stage: 'Connected', last_connect: 'Connected',
      last_connect_time: new Date(new Date('2026-09-01T18:00:00+05:30').getTime() - 3600000).toISOString(),
      last_comment: 'ok', internal_status_comments: 'RM: call 1 - 2026-09-01 09:00',
      call_attempts: 10, call_count: 10,
    });
  }

  // 1. Large-n regression — old point-estimate rule and new confidence
  // rule must AGREE once n is large enough for the posterior to sharpen.
  // Peer pool: 60 RMs x (1 bad + 4 clean) = 300 leads, ~20% baseline.
  // BigBelow: 100 leads, 15 bad — comfortably under the ratio line.
  // BigAbove: 100 leads, 80 bad — comfortably over it.
  (function () {
    const snaps = [];
    for (let rmN = 1; rmN <= 60; rmN++) {
      snaps.push(_confBadRow('ConfPeer' + rmN, 'CP-' + rmN + '-B'));
      for (let leadN = 1; leadN <= 4; leadN++) snaps.push(_confCleanRow('ConfPeer' + rmN, 'CP-' + rmN + '-C' + leadN));
    }
    for (let leadN = 1; leadN <= 15; leadN++) snaps.push(_confBadRow('BigBelow', 'BB-' + leadN));
    for (let leadN = 1; leadN <= 85; leadN++) snaps.push(_confCleanRow('BigBelow', 'BBc-' + leadN));
    for (let leadN = 1; leadN <= 80; leadN++) snaps.push(_confBadRow('BigAbove', 'BA-' + leadN));
    for (let leadN = 1; leadN <= 20; leadN++) snaps.push(_confCleanRow('BigAbove', 'BAc-' + leadN));
    const saved = movementSnapshots;
    movementSnapshots = snaps;
    let result;
    try { result = computeRmPerformance(null, undefined, _roEmptyFilters(), null); }
    finally { movementSnapshots = saved; }
    const below = result.find(r => r.name === 'BigBelow');
    const above = result.find(r => r.name === 'BigAbove');
    assert('Posterior-confidence, large-n regression: BigBelow (ratio ~0.90, well under 1.25) — old rule would not flag, new confidence is near-zero, both agree On Track',
      !!below && below.composite <= below.peerComposite * RM_PERF_FLAG_RATIO && below.confidence < 0.01 && below.classification === 'On Track',
      'below=' + JSON.stringify(below && { composite: below.composite, peerComposite: below.peerComposite, confidence: below.confidence, classification: below.classification }));
    assert('Posterior-confidence, large-n regression: BigAbove (ratio ~1.30, well over 1.25) — old rule would flag, new confidence is near-certain, both agree Below Expectations',
      !!above && above.composite > above.peerComposite * RM_PERF_FLAG_RATIO && above.confidence > 0.90 && above.classification === 'Below Expectations',
      'above=' + JSON.stringify(above && { composite: above.composite, peerComposite: above.peerComposite, confidence: above.confidence, classification: above.classification }));
  })();

  // 2. THE key test — small-n new capability. Peer pool: 5 RMs x 5 clean
  // leads = 25 leads. SmallBad: 5 fully "bad" leads. The old point-
  // estimate rule would NOT flag this (composite stays just under
  // peerComposite*1.25 — shrinkage at n=5 pulls it back too far) but the
  // new confidence rule DOES (~44% confidence >= the 0.40 threshold) —
  // this is the literal reproduction of the originally-reported bug
  // (0 RMs "Below Expectations" under a narrow filter).
  (function () {
    const snaps = [];
    for (let rmN = 1; rmN <= 5; rmN++) {
      for (let leadN = 1; leadN <= 5; leadN++) snaps.push(_confCleanRow('ConfSmallPeer' + rmN, 'CSP-' + rmN + '-' + leadN));
    }
    for (let leadN = 1; leadN <= 5; leadN++) snaps.push(_confBadRow('SmallBad', 'SB-' + leadN));
    const saved = movementSnapshots;
    movementSnapshots = snaps;
    let result;
    try { result = computeRmPerformance(null, undefined, _roEmptyFilters(), null); }
    finally { movementSnapshots = saved; }
    const t = result.find(r => r.name === 'SmallBad');
    assert('Posterior-confidence, small-n: OLD point-estimate rule would NOT flag SmallBad (composite stays under peerComposite*1.25 despite 5/5 bad leads)',
      !!t && t.composite <= t.peerComposite * RM_PERF_FLAG_RATIO,
      't=' + JSON.stringify(t && { composite: t.composite, peerComposite: t.peerComposite, ratio: t.composite / t.peerComposite }));
    assert('Posterior-confidence, small-n: NEW confidence rule DOES flag SmallBad as Below Expectations (~44% confidence clears the 0.40 threshold)',
      !!t && t.classification === 'Below Expectations' && t.confidence >= RM_PERF_CONFIDENCE_THRESHOLD,
      't=' + JSON.stringify(t && { classification: t.classification, confidence: t.confidence }));

    // 2b. Rendered-row check — the confidence annotation appears for this
    // flagged row and is absent for an On Track row in the same table.
    const html = rmPerformanceTableHtml('RM', result, false, 'no data', null);
    assert('Posterior-confidence: rendered table HTML shows a confidence percentage for the flagged Below-Expectations row',
      html.indexOf('SmallBad') !== -1 && /SmallBad[\s\S]{0,400}\d+% confidence/.test(html), 'html snippet around SmallBad missing confidence label');
    const cleanName = 'ConfSmallPeer1';
    const cleanIdx = html.indexOf(cleanName);
    const cleanRowHtml = cleanIdx === -1 ? '' : html.slice(cleanIdx, cleanIdx + 400);
    assert('Posterior-confidence: rendered table HTML shows NO confidence percentage for an On Track row',
      cleanIdx !== -1 && cleanRowHtml.indexOf('% confidence') === -1, 'cleanRowHtml=' + cleanRowHtml);
  })();

  // 3. Degenerate-variance fallback — a lone RM with no real peers (its
  // own self-inclusive peer group of one) makes every rule's raw rate
  // land exactly on its own peer average (0 or 1, not fractional, since
  // there's no other RM to diverge from) — alpha or beta is exactly 0 for
  // every rule, so compositeVariance is exactly 0. Confirms the fallback
  // to the literal point-estimate comparison fires cleanly (no NaN, no
  // throw) rather than dividing by zero.
  (function () {
    const snaps = [];
    for (let leadN = 1; leadN <= 5; leadN++) snaps.push(_confCleanRow('AllClean', 'AC-' + leadN));
    const saved = movementSnapshots;
    movementSnapshots = snaps;
    let result;
    try { result = computeRmPerformance(null, undefined, _roEmptyFilters(), null); }
    finally { movementSnapshots = saved; }
    const t = result.find(r => r.name === 'AllClean');
    assert('Posterior-confidence: degenerate single-member peer group falls back cleanly — compositeVariance is exactly 0, confidence is null, no NaN',
      !!t && t.compositeVariance === 0 && t.confidence === null && !isNaN(t.composite) && !isNaN(t.peerComposite),
      't=' + JSON.stringify(t && { compositeVariance: t.compositeVariance, confidence: t.confidence, composite: t.composite, peerComposite: t.peerComposite }));
    assert('Posterior-confidence: the fallback classification is still correct (composite equals peerComposite exactly here, so On Track)',
      !!t && t.classification === 'On Track', 'classification=' + (t && t.classification));
  })();

  // 4. Opp-Conversion large-n regression mirror (RM_OPP_CONFIDENCE_THRESHOLD).
  // Peer: 200 leads, 80 convert (40%). BigBelow: 60 leads, 24 convert
  // (40%, right at peer — comfortably not low). BigAbove: 60 leads, 6
  // convert (10%, well under half of peer — comfortably low).
  (function () {
    const createdAt = new Date(Date.now() - 5 * 24 * 3600000); // past 48h, basis resolves to h48
    const rows = [];
    for (let i = 1; i <= 200; i++) {
      const snaps = i <= 80 ? [{ hOffset: 1, stage: 'Suspect' }, { hOffset: 40, stage: 'Opportunity' }] : [{ hOffset: 1, stage: 'Suspect' }];
      rows.push(..._roOppLead('OppConfPeer' + i, 'OCP-' + i, createdAt, snaps));
    }
    for (let i = 1; i <= 60; i++) {
      const snaps = i <= 24 ? [{ hOffset: 1, stage: 'Suspect' }, { hOffset: 40, stage: 'Opportunity' }] : [{ hOffset: 1, stage: 'Suspect' }];
      rows.push(..._roOppLead('OppBigBelow', 'OBB-' + i, createdAt, snaps));
    }
    for (let i = 1; i <= 60; i++) {
      const snaps = i <= 6 ? [{ hOffset: 1, stage: 'Suspect' }, { hOffset: 40, stage: 'Opportunity' }] : [{ hOffset: 1, stage: 'Suspect' }];
      rows.push(..._roOppLead('OppBigAbove', 'OBA-' + i, createdAt, snaps));
    }
    const savedSnapshots = movementSnapshots;
    movementSnapshots = rows;
    let classified;
    try {
      const cohort = reconstructRmOppCohort(null, _roEmptyFilters(), null, Date.now());
      classified = classifyRmOppConversion(aggregateRmOppConversion(cohort, undefined));
    } finally { movementSnapshots = savedSnapshots; }
    const below = classified.byName.get('OppBigBelow');
    const above = classified.byName.get('OppBigAbove');
    const peerRate = classified.peer[classified.basis];
    assert('Opp-conversion posterior-confidence, large-n regression: OppBigBelow (40% conversion, at peer) — old rule would not flag, new confidence near-zero, both agree',
      !!below && below.shrunk > RM_OPP_LOW_RATIO * peerRate && below.confidence < 0.01 && !below.lowConversion,
      'below=' + JSON.stringify(below && { shrunk: below.shrunk, confidence: below.confidence, lowConversion: below.lowConversion }));
    assert('Opp-conversion posterior-confidence, large-n regression: OppBigAbove (10% conversion, well under half of peer) — old rule would flag, new confidence near-certain, both agree',
      !!above && above.shrunk <= RM_OPP_LOW_RATIO * peerRate && above.confidence > 0.80 && above.lowConversion,
      'above=' + JSON.stringify(above && { shrunk: above.shrunk, confidence: above.confidence, lowConversion: above.lowConversion }));
  })();

  // 5. Opp-Conversion small-n new-capability mirror. Peer: 20 leads, 8
  // convert (peerRate lands at 0.32 once OppSmallBad's own 0/5 dilutes
  // the self-inclusive pool). OppSmallBad: 5 leads, 0 conversions — at
  // n=5 with K=8, the OLD rule can NEVER catch a 0%-raw small sample at
  // all (shrunk = 8/13*peerRate > 0.5*peerRate always, for K=8 > n=5's
  // own contribution — see RM_OPP_LOW_RATIO's own comment, "an RM needs
  // >=8 leads before a 0%-raw rate can even reach the threshold at all").
  // The new confidence rule (~36%) clears RM_OPP_CONFIDENCE_THRESHOLD (0.35).
  (function () {
    const createdAt = new Date(Date.now() - 5 * 24 * 3600000);
    const rows = [];
    for (let i = 1; i <= 20; i++) {
      const snaps = i <= 8 ? [{ hOffset: 1, stage: 'Suspect' }, { hOffset: 40, stage: 'Opportunity' }] : [{ hOffset: 1, stage: 'Suspect' }];
      rows.push(..._roOppLead('OppConfSmallPeer' + i, 'OCSP-' + i, createdAt, snaps));
    }
    for (let i = 1; i <= 5; i++) rows.push(..._roOppLead('OppSmallBad', 'OSB-' + i, createdAt, [{ hOffset: 1, stage: 'Suspect' }]));
    const savedSnapshots = movementSnapshots;
    movementSnapshots = rows;
    let classified;
    try {
      const cohort = reconstructRmOppCohort(null, _roEmptyFilters(), null, Date.now());
      classified = classifyRmOppConversion(aggregateRmOppConversion(cohort, undefined));
    } finally { movementSnapshots = savedSnapshots; }
    const t = classified.byName.get('OppSmallBad');
    const peerRate = classified.peer[classified.basis];
    assert('Opp-conversion posterior-confidence, small-n: OLD rule would NOT flag OppSmallBad (0/5 conversions, but n=5 < 8 means shrinkage alone can never reach the ratio)',
      !!t && t.shrunk > RM_OPP_LOW_RATIO * peerRate,
      't=' + JSON.stringify(t && { shrunk: t.shrunk, peerRate: peerRate }));
    assert('Opp-conversion posterior-confidence, small-n: NEW confidence rule DOES flag OppSmallBad as lowConversion (~36% confidence clears the 0.35 threshold)',
      !!t && t.lowConversion === true && t.confidence >= RM_OPP_CONFIDENCE_THRESHOLD,
      't=' + JSON.stringify(t && { lowConversion: t.lowConversion, confidence: t.confidence }));
  })();

  // 6. rmPerfNormalCdf reference values (Abramowitz & Stegun 7.1.26

  (function () {

    assert('rmPerfNormalCdf(1.2816) is ~0.90', Math.abs(rmPerfNormalCdf(1.2816) - 0.90) < 1e-4, 'got ' + rmPerfNormalCdf(1.2816));
