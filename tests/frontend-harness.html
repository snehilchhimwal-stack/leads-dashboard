  // ---- 2i. "Behind on Today's Calls" MAX(delta, loggedToday) fix (2026-10-01) ----
  // Real incident: lead 2245665/Riya Yadav, Minas Patel's Western team —
  // call_attempts was identical to its own pre-today baseline (11 = 11)
  // despite a genuine today-dated "Not Reachable" comment logged, so the
  // plain delta read 0 and the lead was incorrectly flagged/emailed as
  // "Behind on Today's Calls". attemptsToday now takes MAX(delta,
  // loggedToday) instead of the delta alone. Calls enrichLead directly
  // (not through the full fetchAndRender() pipeline below — that pipeline's
  // own mocked Movement_Log always comes back empty, so it can never
  // populate _todayCallBaselineByKey and exercise this specific branch)
  // with the module's own baseline map set directly, mirroring exactly
  // what core-filters.js's applyFiltersAndRender does before calling
  // enrichLead for real. Byte-for-byte mirror of SlaEngine.gs's
  // computeSlaFlags_ fix — Tests_SlaEngine.gs carries the same 3 scenarios.
  (function () {
    const savedBaseline = _todayCallBaselineByKey;
    const savedRenderNow = _renderNow;
    _renderNow = new Date(); // resolves to the frozen clock (top of file)
    try {
      _todayCallBaselineByKey = new Map([['L-UCT-1', 10]]); // keyed by LEAD id (email audit F18)
      const baseLead = {
        lead_id: 'L-UCT-1', client_id: 'C-UCT-1', current_stage: 'Suspect',
        lead_assigned_at: new Date(_renderNow.getTime() - 48 * 3600000),
        call_attempts: 10, rm_is_active: true,
      };

      // 5 distinct today-dated comment entries, delta = 0 (call_attempts
      // === its own baseline) — the exact Riya Yadav incident shape.
      const comments5 = [9, 10, 11, 12, 13].map(h =>
        'Test RM: Not Reachable - 2026-09-09 ' + String(h).padStart(2, '0') + ':00').join(' | ');
      let l = enrichLead(Object.assign({}, baseLead, { internal_status_comments: comments5 }));
      assert('underCalledToday 2026-10-01 fix: 5 today-dated comments clear the daily minimum even though call_attempts never moved off its own baseline (real Riya Yadav incident shape)',
        l.underCalledToday === false, 'expected cleared; got ' + l.underCalledToday);

      // Only 4 comments today — still under the daily minimum
      // (CONFIG.MIN_CALLS_PER_DAY = 5), so the fix must NOT over-correct
      // into never flagging anything.
      const comments4 = [9, 10, 11, 12].map(h =>
        'Test RM: Not Reachable - 2026-09-09 ' + String(h).padStart(2, '0') + ':00').join(' | ');
      l = enrichLead(Object.assign({}, baseLead, { internal_status_comments: comments4 }));
      assert('underCalledToday 2026-10-01 fix: still fires when even the comment count alone has not cleared the daily minimum (MAX, not an automatic pass)',
        l.underCalledToday === true, 'expected still flagged; got ' + l.underCalledToday);

      // Sanity: the fix must not weaken the ORIGINAL delta-based detection
      // — a real call-attempts increment with zero same-day comments still
      // clears the minimum via the delta alone, exactly as before.
      l = enrichLead(Object.assign({}, baseLead, { call_attempts: 15, internal_status_comments: '' }));
      assert('underCalledToday 2026-10-01 fix sanity: a real call-attempts delta (15-10=5) with zero same-day comments still clears the minimum via the delta alone, unaffected by the fix',
        l.underCalledToday === false, 'expected cleared via delta alone; got ' + l.underCalledToday);
    } finally {
      _todayCallBaselineByKey = savedBaseline;
      _renderNow = savedRenderNow;
    }
  })();

  // ---- 2i-b. Call baselines are per LEAD, not per customer (email audit F18, 2026-10-07) ----
  // call_attempts is a per-lead counter: every RM copy of ONE lead id carries the identical value, but a customer's several
  // leads (one client_id, different lead_ids) each carry their own. Keyed by client_id, a lead's "calls today" was measured
  // against whichever sibling's snapshot came first (real data: 37 of 764 open Google Non-UTM leads had a different baseline,
  // 3 were wrongly NOT flagged "Behind on Today's Calls"). Mirrors MovementTracker.gs's _readMovementLogRowsGs_ and
  // SlaEngine.gs's computeSlaFlags_ (Tests_SlaEngine.gs / Tests_MovementTracker.gs carry the same scenarios).
  (function () {
    const savedBaseline = _todayCallBaselineByKey;
    const savedSnapshots = _lastSnapshotByKey;
    const savedMovement = movementSnapshots;
    const savedIssueLeads = issueLeads;
    const savedRenderNow = _renderNow;
    _renderNow = new Date(); // the frozen clock: 2026-09-09 14:00 IST
    const ist = (iso) => new Date(iso + '+05:30');
    const yday = ist('2026-09-08T20:00:00'), twoDays = ist('2026-09-07T20:00:00'), earlyToday = ist('2026-09-09T06:00:00');
    try {
      // -- the two baseline builders --
      movementSnapshots = [
        { snapshot_at: twoDays, lead_id: 'L-A', client_id: 'C-SAME', call_attempts: 13 },
        { snapshot_at: twoDays, lead_id: 'L-B', client_id: 'C-SAME', call_attempts: 4 },
        { snapshot_at: yday, lead_id: 'L-B', client_id: 'C-SAME', call_attempts: 6 },
        { snapshot_at: yday, lead_id: 'L-A', client_id: 'C-SAME', call_attempts: 13, RM: 'Test RM Two' }, // a second RM copy of ONE lead
        { snapshot_at: earlyToday, lead_id: 'L-B', client_id: 'C-SAME', call_attempts: 9 },
        { snapshot_at: yday, lead_id: '', client_id: 'C-ORPHAN', call_attempts: 77 },
        { snapshot_at: yday, lead_id: 2245786, client_id: '', call_attempts: 5 },
      ];
      const base = buildTodayCallBaseline(_renderNow);
      assert('F18 buildTodayCallBaseline: sibling leads of one client each keep their OWN pre-today counter (L-A 13, L-B 6)',
        base.get('L-A') === 13 && base.get('L-B') === 6, 'got L-A=' + base.get('L-A') + ' L-B=' + base.get('L-B'));
      assert('F18 buildTodayCallBaseline: nothing is stored under the client id',
        !base.has('C-SAME') && !base.has('l:L-A'), 'keys: ' + Array.from(base.keys()).join(','));
      assert('F18 buildTodayCallBaseline: a numeric lead id is keyed by its string form, and a row with no lead id is dropped',
        base.get('2245786') === 5 && base.size === 3, 'size ' + base.size + ' keys: ' + Array.from(base.keys()).join(','));
      const last = lastSnapshotBefore(_renderNow);
      assert('F18 lastSnapshotBefore: per lead - L-B\'s latest snapshot before now is today\'s early one (9), L-A\'s is yesterday\'s (13)',
        last.get('L-B') && last.get('L-B').call_attempts === 9 && last.get('L-A') && last.get('L-A').call_attempts === 13 && !last.has('C-SAME'),
        'L-B=' + JSON.stringify(last.get('L-B')) + ' L-A=' + JSON.stringify(last.get('L-A')));

      // -- a single-copy lead is measured against ITS OWN baseline --
      const sib = (over) => Object.assign({
        lead_id: 'L-B', client_id: 'C-SAME', current_stage: 'Suspect',
        lead_assigned_at: new Date(_renderNow.getTime() - 48 * 3600000), call_attempts: 9, rm_is_active: true,
      }, over || {});
      _todayCallBaselineByKey = new Map([['L-A', 13], ['L-B', 4], ['C-SAME', 13]]);
      let l = enrichLead(sib());
      assert('F18 enrichLead: a lead is measured against its OWN baseline (9 - 4 = 5 calls today), not a sibling\'s (13 would read 0)',
        l.underCalledToday === false, 'expected cleared; got ' + l.underCalledToday);
      _todayCallBaselineByKey = new Map([['L-A', 2], ['L-B', 9], ['C-SAME', 2]]);
      l = enrichLead(sib());
      assert('F18 enrichLead: a lead with NO calls today is flagged even when a sibling has a low baseline (own 9 - 9 = 0; the sibling\'s 2 would read 7 and hide it)',
        l.underCalledToday === true, 'expected flagged; got ' + l.underCalledToday);
      _todayCallBaselineByKey = new Map([['C-SAME', 0]]);
      l = enrichLead(sib());
      assert('F18 enrichLead: a baseline stored under the client id is NOT used - no own baseline falls back to the comment count (0 here)',
        l.underCalledToday === true, 'expected flagged; got ' + l.underCalledToday);

      // -- a MERGED customer record takes the best per-lead delta (its call_attempts is the max over its leads) --
      const merged = (over) => Object.assign({
        lead_id: 'L-A', client_id: 'C-SAME', current_stage: 'Suspect',
        lead_assigned_at: new Date(_renderNow.getTime() - 48 * 3600000), rm_is_active: true,
        call_attempts: 13, callAttemptsByLeadId: { 'L-A': 13, 'L-B': 9 }, collatedLeadIds: ['L-A', 'L-B'], collatedFrom: 2,
      }, over || {});
      _todayCallBaselineByKey = new Map([['L-A', 13], ['L-B', 4]]);
      l = enrichLead(merged());
      assert('F18 merged record: the sibling that actually made 5 calls today clears it (L-B 9 - 4) even though the primary lead made none (13 - 13)',
        l.underCalledToday === false, 'expected cleared; got ' + l.underCalledToday);
      _todayCallBaselineByKey = new Map([['L-A', 13], ['L-B', 9]]);
      l = enrichLead(merged());
      assert('F18 merged record: no lead of the customer made any calls today -> flagged',
        l.underCalledToday === true, 'expected flagged; got ' + l.underCalledToday);
      _todayCallBaselineByKey = new Map([['L-B', 4]]);
      l = enrichLead(merged());
      assert('F18 merged record: a lead without a baseline contributes nothing - the one with a baseline still counts (L-B 9 - 4 = 5)',
        l.underCalledToday === false, 'expected cleared; got ' + l.underCalledToday);
      _todayCallBaselineByKey = new Map();
      l = enrichLead(merged());
      assert('F18 merged record: no baseline for any of its leads -> comment-count fallback (0 comments -> flagged)',
        l.underCalledToday === true, 'expected flagged; got ' + l.underCalledToday);

      // -- the "no comment" follow-up text compares against the right lead's snapshot --
      const fiveHoursAgo = new Date(_renderNow.getTime() - 5 * 3600000);
      _lastSnapshotByKey = new Map([['L-A', { atMs: fiveHoursAgo.getTime(), call_attempts: 13 }], ['L-B', { atMs: fiveHoursAgo.getTime(), call_attempts: 4 }]]);
      let txt = noCommentFollowUp({ lead_id: 'L-B', client_id: 'C-SAME', call_attempts: 9 });
      assert('F18 noCommentFollowUp: compares against the lead\'s OWN snapshot (9 - 4 = 5 more attempts), not a sibling\'s',
        /5 more call attempts/.test(txt), txt);
      txt = noCommentFollowUp({ lead_id: 'L-B', client_id: 'C-SAME', call_attempts: 4 });
      assert('F18 noCommentFollowUp: unchanged since its own snapshot -> "no new call attempts" (the sibling\'s higher counter must not change that)',
        /no new call attempts/.test(txt), txt);
      txt = noCommentFollowUp({ lead_id: 'L-A', client_id: 'C-SAME', call_attempts: 13, collatedLeadIds: ['L-A', 'L-B'] });
      assert('F18 noCommentFollowUp: a merged record compares against the snapshot of the lead with the highest counter (L-A 13)',
        /no new call attempts/.test(txt), txt);
      // …even when the record's primary lead is NOT the one with the highest counter (primary L-B 4; the merged call_attempts is L-A's 13).
      txt = noCommentFollowUp({ lead_id: 'L-B', client_id: 'C-SAME', call_attempts: 13, collatedLeadIds: ['L-B', 'L-A'] });
      assert('F18 noCommentFollowUp: …regardless of which of its leads is the record\'s primary (primary L-B has 4, but the record carries L-A\'s 13)',
        /no new call attempts/.test(txt), txt);

      // -- Stalled Leads: attempts are compared with THIS lead's own snapshot history --
      const stallBase = (over) => enrichLead(Object.assign({
        lead_id: 'L-B', client_id: 'C-SAME', current_stage: 'Suspect', RM: 'Test RM One',
        lead_assigned_at: new Date(_renderNow.getTime() - 72 * 3600000), call_attempts: 9, rm_is_active: true, internal_status_comments: '',
      }, over || {}));
      const hoursAgo = (h) => new Date(_renderNow.getTime() - h * 3600000);
      issueLeads = [stallBase()];
      movementSnapshots = [
        { snapshot_at: hoursAgo(8), lead_id: 'L-B', client_id: 'C-SAME', call_attempts: 4 },   // its own: attempts have risen since
        { snapshot_at: hoursAgo(7), lead_id: 'L-A', client_id: 'C-SAME', call_attempts: 13 },  // a sibling's, LATER: higher counter
      ];
      assert('F18 computeStalledLeads: a sibling lead\'s later, higher snapshot does not make a lead whose own attempts rose (4 -> 9) look stalled',
        !computeStalledLeads().some(r => r.lead_id === 'L-B'), 'L-B was reported stalled');
      movementSnapshots = [
        { snapshot_at: hoursAgo(8), lead_id: 'L-B', client_id: 'C-SAME', call_attempts: 9 },   // its own: unchanged
        { snapshot_at: hoursAgo(7), lead_id: 'L-A', client_id: 'C-SAME', call_attempts: 3 },   // a sibling's, LATER: lower counter
      ];
      assert('F18 computeStalledLeads: a sibling lead\'s later, lower snapshot does not hide a lead whose own attempts are unchanged (9 -> 9)',
        computeStalledLeads().some(r => r.lead_id === 'L-B' && r.issue === 'Attempts Unchanged (6h+)'), 'L-B was not reported stalled');
      movementSnapshots = [{ snapshot_at: hoursAgo(7), lead_id: 'L-A', client_id: 'C-SAME', call_attempts: 3 }];
      assert('F18 computeStalledLeads: a lead with no snapshot of its own is skipped (not judged from a sibling\'s history)',
        !computeStalledLeads().some(r => r.lead_id === 'L-B'), 'L-B was judged from the sibling\'s snapshot');
    } finally {
      _todayCallBaselineByKey = savedBaseline;
      _lastSnapshotByKey = savedSnapshots;
      movementSnapshots = savedMovement;
      issueLeads = savedIssueLeads;
      _renderNow = savedRenderNow;
    }
  })();

  // ---- 2j. Client-side feature usage tracking (dead-code audit Part 3, 2026-10-03) ----
  // js/sheets-writeback.js: computeFeatureUsageUpsert_ (pure) + recordComponentUsage
  // (the async wrapper). No fetch-mocking exists anywhere in this harness yet (the
  // other upsert*Rows functions in sheets-writeback.js are likewise untested here) --
  // scoped to what's safely testable without one: the pure decision logic exhaustively,
  // plus recordComponentUsage's input-validation/throttle/no-sheet-no-op guards, none
  // of which should ever reach a real fetch() call in this harness's default state
  // (_currentSheetId stays '' here — never set to a real id, unlike gateAccessToken).
  await (async function () {
    const savedSession = _componentUsageRecordedThisSession;
    try {
      // computeFeatureUsageUpsert_: brand-new component, no existing rows at all.
      let r = computeFeatureUsageUpsert_([], 'tab-overview', '2026-10-03 12:00:00');
      assert('computeFeatureUsageUpsert_: a component with zero existing rows appends (rowNum null)',
        r.rowNum === null, 'expected rowNum null; got ' + r.rowNum);
      assert('computeFeatureUsageUpsert_: a brand-new component starts use_count at 1',
        r.rowValues[2] === 1, 'expected use_count 1; got ' + r.rowValues[2]);
      assert('computeFeatureUsageUpsert_: a brand-new component sets first_seen_at to now (nothing to inherit)',
        r.rowValues[3] === '2026-10-03 12:00:00', 'expected first_seen_at = now; got ' + r.rowValues[3]);

      // Existing rows present, none matching this componentId -- still an append.
      const existingOther = [['tab-people', '2026-09-20 08:00:00', 5, '2026-08-01 09:00:00']];
      r = computeFeatureUsageUpsert_(existingOther, 'tab-overview', '2026-10-03 12:00:00');
      assert('computeFeatureUsageUpsert_: existing rows for OTHER components still append for a new one (rowNum null)',
        r.rowNum === null, 'expected rowNum null; got ' + r.rowNum);

      // Existing row for THIS component (at sheet row 3, i.e. existingValues[1]) --
      // an update, count incremented from its prior value, first_seen_at PRESERVED
      // (not overwritten with "now").
      const existingSame = [
        ['tab-people', '2026-09-20 08:00:00', 5, '2026-08-01 09:00:00'],
        ['tab-overview', '2026-09-25 10:00:00', 41, '2026-08-05 07:30:00'],
      ];
      r = computeFeatureUsageUpsert_(existingSame, 'tab-overview', '2026-10-03 12:00:00');
      assert('computeFeatureUsageUpsert_: an existing component updates the right sheet row (header at row 1, data 0-indexed from row 2 -> row 3)',
        r.rowNum === 3, 'expected rowNum 3; got ' + r.rowNum);
      assert('computeFeatureUsageUpsert_: use_count increments from its prior stored value, not reset to 1',
        r.rowValues[2] === 42, 'expected use_count 42 (41+1); got ' + r.rowValues[2]);
      assert('computeFeatureUsageUpsert_: first_seen_at is PRESERVED from the existing row, never overwritten with "now"',
        r.rowValues[3] === '2026-08-05 07:30:00', 'expected first_seen_at preserved; got ' + r.rowValues[3]);
      assert('computeFeatureUsageUpsert_: last_used_at (column B) IS updated to "now"',
        r.rowValues[1] === '2026-10-03 12:00:00', 'expected last_used_at = now; got ' + r.rowValues[1]);

      // Existing row has a blank/missing first_seen_at (pre-this-feature data
      // shape, or a malformed row) -- falls back to "now" rather than storing
      // a blank, same as the brand-new-component case.
      const existingBlankFirstSeen = [['tab-overview', '2026-09-25 10:00:00', 3, '']];
      r = computeFeatureUsageUpsert_(existingBlankFirstSeen, 'tab-overview', '2026-10-03 12:00:00');
      assert('computeFeatureUsageUpsert_: a blank existing first_seen_at falls back to "now", never stored blank',
        r.rowValues[3] === '2026-10-03 12:00:00', 'expected fallback to now; got ' + JSON.stringify(r.rowValues[3]));

      // recordComponentUsage: input validation -- an unknown componentId is a
      // complete no-op, never even touches the session-throttle Set.
      _componentUsageRecordedThisSession = new Set();
      await recordComponentUsage('tab-does-not-exist');
      assert('recordComponentUsage: an unrecognized componentId is rejected before the throttle Set is touched',
        _componentUsageRecordedThisSession.size === 0, 'expected empty Set; got size ' + _componentUsageRecordedThisSession.size);

      // recordComponentUsage: a KNOWN componentId is recorded in the
      // in-session throttle Set -- and with no real sheet connected in
      // this harness (_currentSheetId stays '' here), it resolves without
      // throwing and without attempting any network call (the awaited
      // call completing at all, with no mocked fetch to catch it, is
      // itself proof no real network call was made).
      _componentUsageRecordedThisSession = new Set();
      await recordComponentUsage('tab-overview');
      assert('recordComponentUsage: a known componentId is added to the in-session throttle Set',
        _componentUsageRecordedThisSession.has('tab-overview'), 'expected "tab-overview" in the throttle Set');
      assert('recordComponentUsage: TRACKED_COMPONENT_IDS lists exactly the 9 real dashboard tabs',
        TRACKED_COMPONENT_IDS.length === 9 && TRACKED_COMPONENT_IDS.includes('tab-oppmonitor'),
        'expected 9 tracked ids incl. tab-oppmonitor; got ' + JSON.stringify(TRACKED_COMPONENT_IDS));

      // Part 6 (2026-10-03) -- "repeated alerts" / "restarts" boundary
      // coverage. Same session, called again (no reset): the throttle
      // must stay at exactly one entry, not grow or re-process.
      await recordComponentUsage('tab-overview');
      assert('recordComponentUsage: a second call in the SAME session for an already-recorded component is a no-op (Set stays at one entry)',
        _componentUsageRecordedThisSession.size === 1, 'expected Set size 1; got ' + _componentUsageRecordedThisSession.size);

      // "Restart" -- a hard page reload resets this module-level Set (by
      // design, see its own declaration comment in sheets-writeback.js).
      // The same component must be recorded again after that, not stay
      // permanently throttled by state that no longer exists post-reload.
      _componentUsageRecordedThisSession = new Set();
      await recordComponentUsage('tab-overview');
      assert('recordComponentUsage: after a simulated restart (fresh throttle Set), a previously-recorded component is recorded again, not silently skipped',
        _componentUsageRecordedThisSession.has('tab-overview'), 'expected "tab-overview" recorded again after restart');
    } finally {
      _componentUsageRecordedThisSession = savedSession;
    }
  })();

  // ---- 2k. Browser send-safety gate (email audit P11 / F19, 2026-10-07) ----
  // js/reports-gmail.js: prepareGmailSend + performGmailSend. performGmailSend used to pass whatever it was handed straight to
  // the Gmail API. The address and visible-text vectors below are the SAME ones Tests_EmailInfra.gs asserts against its
  // Apps Script twins (emailAddressListProblemsGs_ / visibleTextOfHtmlGs_) — the two gates are kept in parity by hand.
  await (async function () {
    const decodeRaw = (raw) => {
      const bin = atob(raw.replace(/-/g, '+').replace(/_/g, '/'));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    };
    const addr = (list, required) => gmailAddressListProblems(list, 'To', required).length;

    // -- shared address vectors (mirror Tests_EmailInfra.gs) --
    assert('gmailAddressListProblems: a plain address is fine', addr('a@homesfy.in', true) === 0);
    assert('gmailAddressListProblems: a comma list of valid addresses is fine', addr('a@homesfy.in, b.c+d@x.co.in', true) === 0);
    assert('gmailAddressListProblems: a semicolon list (how the recipients table may store it) is fine too', addr('a@homesfy.in; b@homesfy.in', true) === 0);

    // redesign moved this section's data source (see HANDOVER.md §9.7).
    assert('Repeat Offenders shows a "no data yet" notice on empty Movement_Log (no throw)', textOf('repeatOffendersNotice').indexOf('Movement_Log') !== -1);
    assert('Movement/Overnight rendered without throwing on empty Movement_Log', !!document.getElementById('overnightList'));

    // Opp Monitor: the shared mock above returns [] for every non-Leads
    // range, so Opp_Monitor_Period/Month already went through
    // fetchOppMonitorData (wired into fetchAndRender itself) and hit the
    // "missing tab" graceful path for free — assert it renders the

    assert('Opp Monitor shows a "no data yet" notice when both sheets are missing (no throw)', textOf('oppMonitorChecklistNotice').indexOf('No Opp_Monitor data yet') !== -1);

    const opsTabBtn = document.querySelector('.tab-btn[data-tab="tab-operations"]');

  // ---- 6. Opp Monitor, isolated fixture ----
  // Separate synthetic Opp_Monitor_Period/Month data, run directly through
  // fetchOppMonitorData()/renderOppMonitorTab() rather than a full second
  // fetchAndRender() pass — this tab reads neither leads nor filterState,
  // so it doesn't need the whole pipeline re-run to exercise its real
  // logic. Frozen clock is 2026-09-09 (see freezeClock above), so "current
  // month" = 2026-09, giving a 3-month window of 2026-07/08/09.

    const oppPeriodHeaders = ['period_key', 'year_month', 'period_number', 'period_label', 'date_from', 'date_to',
      'total_leads', 'same_day_count', 'h48_count', 'same_day_pct', 'h48_pct',
      'step1_status', 'step1_at', 'step2_status', 'step2_at', 'step3_status', 'step3_at', 'updated_at', 'source',

    const oppPeriodRows = [
      ['2026-07_P1', '2026-07', 1, '1st-10th', '2026-07-01', '2026-07-10', 1000, 300, 400, 30, 40, 'done', '2026-07-11', 'done', '2026-07-11', 'done', '2026-07-11', '2026-07-11', 'Claude session', 0.9, 21.6],
      ['2026-07_P2', '2026-07', 2, '11th-20th', '2026-07-11', '2026-07-20', 1000, 320, 420, 32, 42, 'done', '2026-07-21', 'done', '2026-07-21', 'done', '2026-07-21', '2026-07-21', 'Claude session', 0.85, 20.4],
      ['2026-07_P3', '2026-07', 3, '21st-end', '2026-07-21', '2026-07-31', 1000, 340, 440, 34, 44, 'done', '2026-08-01', 'done', '2026-08-01', 'done', '2026-08-01', '2026-08-01', 'Claude session', 1.0, 24.0],
      ['2026-08_P1', '2026-08', 1, '1st-10th', '2026-08-01', '2026-08-10', 1100, 350, 450, 35, 45, 'done', '2026-08-11', 'done', '2026-08-11', 'done', '2026-08-11', '2026-08-11', 'Claude session', 1.1, 26.4],
      ['2026-08_P2', '2026-08', 2, '11th-20th', '2026-08-11', '2026-08-20', 1100, 360, 460, 36, 46, 'done', '2026-08-21', 'done', '2026-08-21', 'done', '2026-08-21', '2026-08-21', 'Claude session', 0.95, 22.8],
      ['2026-08_P3', '2026-08', 3, '21st-end', '2026-08-21', '2026-08-31', 1100, 380, 480, 38, 48, 'done', '2026-09-01', 'done', '2026-09-01', 'done', '2026-09-01', '2026-09-01', 'Claude session', 0.88, 21.1],
      ['2026-09_P1', '2026-09', 1, '1st-10th', '2026-09-01', '2026-09-10', 1200, 400, 500, 40, 50, 'done', '2026-09-11', 'done', '2026-09-11', 'done', '2026-09-11', '2026-09-11', 'Claude session', 0.92, 22.1],
      // Sep P2: step1/2 done, step3 (email) deliberately pending — tests
      // a partial row's chips AND that the results table shows a row
      // whose own checklist isn't finished yet (results != checklist).
      ['2026-09_P2', '2026-09', 2, '11th-20th', '2026-09-11', '2026-09-20', 1200, 410, 510, 41, 51, 'done', '2026-09-21', 'done', '2026-09-21', '', '', '2026-09-21', 'Claude session', 0.87, 20.9],
      // Sep P3 deliberately absent — period hasn't been reached yet.
    ];
    const oppMonthHeaders = ['month_key', 'year_month', 'month_label', 'total_leads', 'same_day_count', 'h48_count', 'same_day_pct', 'h48_pct',
      'step1_status', 'step1_at', 'step2_status', 'step2_at', 'step3_status', 'step3_at', 'updated_at', 'source',
      'avg_days_to_opp', 'avg_hrs_to_opp'];
    const oppMonthRows = [
      ['2026-07', '2026-07', 'July 2026', 3000, 960, 1260, 32, 42, 'done', '2026-08-01', 'done', '2026-08-01', 'done', '2026-08-01', '2026-08-01', 'Claude session', 0.93, 22.3],
      ['2026-08', '2026-08', 'August 2026', 3300, 1110, 1440, 33.6, 43.6, 'done', '2026-09-01', 'done', '2026-09-01', 'done', '2026-09-01', '2026-09-01', 'Claude session', 0.97, 23.3],
      // Sep month row deliberately absent — month isn't over yet.
    ];

    sheetsApiValuesGet = async function (sheetId, range) {
      if (range.indexOf('Opp_Monitor_Period') === 0) return [oppPeriodHeaders, ...oppPeriodRows];
      if (range.indexOf('Opp_Monitor_Month') === 0) return [oppMonthHeaders, ...oppMonthRows];
      return [];
    };

    // This block's tables now also read the global `leads` array (live
    // computation, added 2026-09-21) — pin it to empty here so every
    // assertion below is deliberately testing "no sourced row AND no
    // leads to compute live from" rather than accidentally inheriting
    // whatever the earlier main-flow fixture happened to leave behind.
    const _oppMonitorPriorLeads = leads;
    leads = [];

    let oppThrew = null;
    try {
      await fetchOppMonitorData('harness-sheet-id');
      renderOppMonitorTab();
    } catch (e) { oppThrew = e; }
    assert('Opp Monitor isolated fixture: fetch+render completes with no throw', !oppThrew, oppThrew && (oppThrew.message + '\n' + oppThrew.stack));

    if (!oppThrew) {
      const oppTextOf = id => { const el = document.getElementById(id); return el ? el.textContent : ''; };

      // Checklist: Sep has 3 done (P1's 3 steps) + 2 done (P2's step1/step2)
      // + 0 done at month level (no Sep month row yet) = 5 of 12.
      assert('Opp Monitor checklist count shows 5/12 for the in-progress month', oppTextOf('oppMonitorChecklistCount').indexOf('5/12') !== -1, oppTextOf('oppMonitorChecklistCount'));
      const checklistHtml = document.getElementById('oppMonitorChecklist').innerHTML;
      assert('Checklist shows Period 2 Leadership email as Pending', /Leadership email: Pending/.test(checklistHtml));
      assert('Checklist shows Period 1 Data collection as Done', /Data collection: Done/.test(checklistHtml));

      const periodTableText = oppTextOf('oppMonitorPeriodTable');
      assert('Period table shows readable month names (July/August/September 2026), not raw year_month', ['July 2026', 'August 2026', 'September 2026'].every(m => periodTableText.indexOf(m) !== -1));
      assert('Period table does NOT show a row for the absent September Period 3', (periodTableText.match(/21st-end/g) || []).length === 2); // only Jul + Aug P3, not a 3rd for Sep
      assert('Period table shows the Same-Day/48h opp counts, not just percentages', periodTableText.indexOf('300') !== -1 && periodTableText.indexOf('400') !== -1); // Jul P1: same_day_count=300, h48_count=400
      assert('Period table shows Avg Days to Opp and Avg Hrs to Opp', periodTableText.indexOf('0.9') !== -1 && periodTableText.indexOf('21.6') !== -1); // Jul P1 values

      // Cross-month delta: Sep P1 (40.0%) vs Aug P3 (38.0%) = +2.0pp, and
      // the ordered-slot sequence must resolve that pairing across the
      // month boundary, not against some other row.
      assert('Period table renders a +2.0pp up-badge for Sep P1 vs Aug P3 same-day Opp%', /▲ 2\.0pp/.test(periodTableText));

      const monthTableText = oppTextOf('oppMonitorMonthTable');
      assert('Monthly trend table lists July and August but not the absent September row', monthTableText.indexOf('July 2026') !== -1 && monthTableText.indexOf('August 2026') !== -1 && monthTableText.indexOf('2026-09') === -1);
      assert('Monthly trend table shows opp counts and Avg Days/Hrs to Opp', monthTableText.indexOf('960') !== -1 && monthTableText.indexOf('0.93') !== -1 && monthTableText.indexOf('22.3') !== -1); // July month row

      // ---- Live computation (2026-09-21): Sep P3 has no sourced row —
      // give it 4 synthetic leads inside its 21st-30th window and confirm
      // a correctly-computed "Live" row now fills that gap.
      // A: same-day (6h) and within-48h. B: exactly 48h -- boundary, must
      // count as within-48h. C: never reached Opportunity (opp_at blank)
      // -- counts toward total only. D: 96h -- neither same-day nor
      // within-48h, still counts toward the average.
      // Expected: total=4, same_day=1 (25.0%), h48=2 (50.0%),
      // avg_hrs=(6+48+96)/3=50.0, avg_days=50/24=2.08.
      leads = [
        { lead_id: 'live-a', lead_assigned_at: '2026-09-21T04:00:00.000Z', opp_at: '2026-09-21T10:00:00.000Z' },
        { lead_id: 'live-b', lead_assigned_at: '2026-09-22T04:00:00.000Z', opp_at: '2026-09-24T04:00:00.000Z' },
        { lead_id: 'live-c', lead_assigned_at: '2026-09-25T04:00:00.000Z', opp_at: '' },
        { lead_id: 'live-d', lead_assigned_at: '2026-09-28T04:00:00.000Z', opp_at: '2026-10-02T04:00:00.000Z' },
      ];
      renderOppMonitorTab();
      const livePeriodText = oppTextOf('oppMonitorPeriodTable');
      assert('Live computation: Sep P3 now shows a Live-tagged row', /Live/.test(livePeriodText) && livePeriodText.indexOf('21st') !== -1);
      // 25.0%/50.0% only arise from total=4, same_day=1, h48=2 — a
      // narrower, more precise check than asserting "4" appears somewhere
      // in concatenated cell text.
      assert('Live computation: same-day% = 25.0, 48h% = 50.0 (implies total=4, same_day=1, h48=2)', livePeriodText.indexOf('25.0%') !== -1 && livePeriodText.indexOf('50.0%') !== -1);
      assert('Live computation: avg hrs/days to Opp = 50 / 2.08', livePeriodText.indexOf('50') !== -1 && livePeriodText.indexOf('2.08') !== -1);

      // A slot that already has a real Opp_Monitor_Period row must never
      // be overridden by a live computation, even with qualifying leads
      // in scope — give July P1's exact window a synthetic lead too and
      // confirm July P1 still shows the SOURCED 37.7%-style figures
      // (300/400 counts from the fixture above), not a live recompute.
      leads.push({ lead_id: 'live-e', lead_assigned_at: '2026-07-05T04:00:00.000Z', opp_at: '2026-07-05T05:00:00.000Z' });
      renderOppMonitorTab();
      const sourcedStillWinsText = oppTextOf('oppMonitorPeriodTable');
      assert('Live computation never overrides an existing sourced row (July P1 still shows its real 300/400 counts)', sourcedStillWinsText.indexOf('300') !== -1 && sourcedStillWinsText.indexOf('400') !== -1);

      leads = _oppMonitorPriorLeads;

      if (oppTabBtn) oppTabBtn.click();
      assert('Clicking Opp Monitor hides the shared filter bar', filterBarEl && filterBarEl.style.display === 'none');
      if (overviewTabBtn) overviewTabBtn.click();
      assert('Switching back to Overview restores the shared filter bar', filterBarEl && filterBarEl.style.display === 'flex');

  }

  // ---- 7. Snapshot -> baseline -> render, end to end (email audit F18, 2026-10-07) ----
  // A SECOND real fetchAndRender() pass, run last so nothing after it depends on its state. The Movement_Log it reads is
  // built in the exact shape the Apps Script writer produces and the Sheets API returns (header = MOVEMENT_LOG_COLUMNS +
  // content_hash; date cells as serial numbers, which is what valueRenderOption=UNFORMATTED_VALUE / SERIAL_NUMBER gives), and
  // goes through the REAL fetchMovementLog -> buildTodayCallBaseline -> enrichLead -> renderAll chain. The same lead ids and
  // the same expected table are asserted by Tests_EmailLifecycleFullCycle.gs's TestEFC_runSnapshotChain_ against the real
  // snapshotPeriodic() output, so the two runtimes are checked against ONE table:
  //   E101  customer C-E1, counter 13, no calls today        -> behind
  //   E102  customer C-E1 (sibling), counter 4 -> 9          -> NOT behind (own baseline 4: 5 calls)  <- the F18 trap
  //   E201  own customer, counter 2 -> 2                     -> behind
  //   E301  own customer, counter 1 -> 7                     -> NOT behind (6 calls)
  //   E401  created today, 6 attempts                        -> NOT behind (a lead created today is judged on its raw count)
  //   E402  created today, 2 attempts                        -> behind
  // Waits on explicit conditions (the baseline is built / filtering finished), never a fixed sleep. Frozen clock: 2026-09-09
  // 14:00 IST, so "today" starts at 00:00 IST and every snapshot below is 24h+ old unless it is deliberately today's.
  {
    const SHEET_EPOCH_OFFSET = 25569; // days from 1899-12-30 to 1970-01-01
    const serialAgo = h => (Date.now() - h * H + 330 * 60000) / 86400000 + SHEET_EPOCH_OFFSET; // IST wall clock as a sheet serial
    const e2eLead = (id, client, stage, createdH, attempts) => row({
      lead_id: id, RM: 'Ravi Kumar', TL: 'Priya Sharma', rm_is_active: true, project: 'Skyline Towers', region: 'North',
      client: 'Client ' + id, lead_assigned_at: ago(createdH), group_source: 'Google', source_bucket: 'Organic', current_stage: stage,
      client_id: client, last_connect_time: ago(0.5), call_attempts: attempts,
    });
    const e2eLeadValues = [headers.slice(),
      e2eLead('E101', 'C-E1', 'Not Updated', 60, 13),
      e2eLead('E102', 'C-E1', 'Suspect', 60, 9),
      e2eLead('E201', 'C-E2', 'Suspect', 60, 2),
      e2eLead('E301', 'C-E3', 'Suspect', 60, 7),
      e2eLead('E401', 'C-E4', 'Suspect', 5, 6),
      e2eLead('E402', 'C-E5', 'Suspect', 5, 2),
    ];
    const mlHeader = MOVEMENT_LOG_COLUMNS.concat(['content_hash']);
    const mlRow = (atH, leadId, client, attempts) => mlHeader.map(key => {
      if (key === 'snapshot_at') return serialAgo(atH);
      if (key === 'snapshot_label') return 'e2e';
      if (key === 'lead_id') return leadId;
      if (key === 'client_id') return client;
      if (key === 'RM') return 'Ravi Kumar';
      if (key === 'call_attempts') return attempts;
      if (key === 'content_hash') return 'h-' + leadId + '-' + attempts;
      return '';
    });
    const e2eMovementValues = [mlHeader,
      mlRow(25, 'E102', 'C-E1', 4),   // the sibling's snapshot is the EARLIER one; E101's (below) is the later - the F18 trap
      mlRow(24, 'E101', 'C-E1', 13),
      mlRow(24, 'E201', 'C-E2', 2),
      mlRow(24, 'E301', 'C-E3', 1),
      mlRow(8, 'E102', 'C-E1', 9),    // today's own early capture (06:00 IST): the latest snapshot, but never a baseline
      mlRow(24, '', 'C-E1', 77),      // no lead id: ignored
    ];
    sheetsApiValuesGet = async function (sheetId, range) {
      if (/!A2:AZ$/.test(range)) return e2eLeadValues;
      if (range.indexOf('Movement_Log') === 0) return e2eMovementValues;
      return [];
    };

    let e2eThrew = null;
    try {
      await fetchAndRender();
      // An ITERATION cap, not Date.now(): this harness freezes the clock (FakeDate.now is constant), so a time-based cap can
      // never expire - a failing e2e would hang the whole harness instead of failing. 250 x 20 ms = at most 5 s of real time.
      for (let i = 0; i < 250 && !(_todayCallBaselineByKey && _todayCallBaselineByKey.has('E101') && !(typeof _isApplyingFilters !== 'undefined' && _isApplyingFilters)); i++) {
        await new Promise(r => setTimeout(r, 20));
      }
      await new Promise(r => setTimeout(r, 30));
    } catch (e) { e2eThrew = e; }
    assert('E2E snapshot->render: the second fetchAndRender pass completes with no uncaught exception', !e2eThrew, e2eThrew && (e2eThrew.message + '\n' + e2eThrew.stack));

    if (!e2eThrew) {
      assert('E2E snapshot->render: Movement_Log was read through the real fetch (state ok, 5 usable rows of 6 - the lead-id-less one is dropped)',
        movementFetchState === 'ok' && movementSnapshots.length === 5, 'state=' + movementFetchState + ' rows=' + movementSnapshots.length);
      assert('E2E snapshot->render: the baselines are per LEAD id and ignore today\'s own snapshot (E101 13, E102 4 - not 9, E201 2, E301 1)',
        _todayCallBaselineByKey.get('E101') === 13 && _todayCallBaselineByKey.get('E102') === 4 && _todayCallBaselineByKey.get('E201') === 2 && _todayCallBaselineByKey.get('E301') === 1 &&
        !_todayCallBaselineByKey.has('C-E1') && _todayCallBaselineByKey.size === 4,
        JSON.stringify(Array.from(_todayCallBaselineByKey.entries())));
      assert('E2E snapshot->render: the latest-snapshot map holds today\'s early capture for E102 (9)', _lastSnapshotByKey.get('E102') && _lastSnapshotByKey.get('E102').call_attempts === 9, JSON.stringify(_lastSnapshotByKey.get('E102')));

      const byId = {};
      issueLeads.forEach(l => { byId[String(l.lead_id)] = l; });
      const table = {};
      ['E101', 'E102', 'E201', 'E301', 'E401', 'E402'].forEach(id => { table[id] = byId[id] ? byId[id].underCalledToday : 'MISSING'; });
      assert('E2E snapshot->render: the shared per-lead "behind on today\'s calls" table (same one the Apps Script e2e asserts)',
        JSON.stringify(table) === JSON.stringify({ E101: true, E102: false, E201: true, E301: false, E401: false, E402: true }), JSON.stringify(table));

      const dueText = document.getElementById('dueTodayList') ? document.getElementById('dueTodayList').textContent : '';
      assert('E2E snapshot->render: the rendered "Behind on Today\'s Calls" list names E101, E201 and E402',
        ['E101', 'E201', 'E402'].every(id => dueText.indexOf(id) !== -1), dueText.slice(0, 200));
      assert('E2E snapshot->render: …and does NOT name E102 (the sibling), E301 or E401',
        ['E102', 'E301', 'E401'].every(id => dueText.indexOf(id) === -1), dueText.slice(0, 200));

      const merged = leads.find(l => l.client_id === 'C-E1');
      assert('E2E snapshot->render: the merged customer record for C-E1 carries both leads\' counters and is NOT behind (its best lead made 5 calls)',
        !!merged && merged.callAttemptsByLeadId && merged.callAttemptsByLeadId.E101 === 13 && merged.callAttemptsByLeadId.E102 === 9 && merged.underCalledToday === false,
        merged ? JSON.stringify({ c: merged.callAttemptsByLeadId, u: merged.underCalledToday }) : 'no merged record');
    }
  }

  // ---- Cross-runtime content-hash parity (2026-09-25 incident) ----
  // The SAME known-answer vector Tests_MovementTracker.gs asserts against
  // _leadContentHashGs_: SHA-256 over SNAPSHOT_FIELD_KEYS' values joined with
  // a real NUL, lead_id 'L-1', call_attempts 7, every other field blank. The
  // live Apps Script copy hashed with a space here until 2026-09-25, so the
  // two runtimes disagreed on every lead and dedup broke across writers.
  // Recompute BOTH copies together whenever SNAPSHOT_COLUMNS_ changes.
  if (typeof leadContentHash === 'function') {
    const parityHash = await leadContentHash({ lead_id: 'L-1', call_attempts: 7 });
    assert('leadContentHash matches the shared known-answer vector Tests_MovementTracker.gs asserts against the Apps Script twin',
      parityHash === 'd692122a3012092b490e4d7bf0a0e6a19c617af2d8f0d69672ac0d7f5bce5210', 'got ' + parityHash);
  }

  // ---- Content-hash dedup identity is lead_id + RM, not client_id (2026-09-26) ----
  // Same literals Tests_MovementTracker.gs asserts against _dedupKeyGs_. A customer's
  // several rows share a client_id; keyed by it only one could ever match its stored
  // hash and the rest were re-appended on every capture.
  if (typeof movementDedupKey === 'function' && typeof latestMovementLogHashByKey === 'function') {
    assert('movementDedupKey trims and joins lead_id|RM (shared vector with the Apps Script twin)', movementDedupKey(' L-1 ', ' Test RM One ') === 'L-1|Test RM One', movementDedupKey(' L-1 ', ' Test RM One '));
    assert('movementDedupKey keys a blank RM as Unassigned (shared vector)', movementDedupKey('L-2', '') === 'L-2|Unassigned');
    assert('movementDedupKey keys a numeric lead_id and null RM cleanly (shared vector)', movementDedupKey(2180637, null) === '2180637|Unassigned');
    const priorMovementSnapshots = movementSnapshots;
    movementSnapshots = [
      { snapshot_at: 1000, client_id: 'C-M', lead_id: 'L-M', RM: 'Test RM One', content_hash: 'h1' },
      { snapshot_at: 1000, client_id: 'C-M', lead_id: 'L-M', RM: 'Test RM Two', content_hash: 'h2' },
      { snapshot_at: 500, client_id: 'C-M', lead_id: 'L-M', RM: 'Test RM Two', content_hash: 'h-old' },
    ];
    const dedupMap = latestMovementLogHashByKey();
    assert('latestMovementLogHashByKey keeps one latest hash PER ROW (two rows sharing a client_id stay distinct)',
      Object.keys(dedupMap).length === 2 && dedupMap['L-M|Test RM One'] === 'h1' && dedupMap['L-M|Test RM Two'] === 'h2', JSON.stringify(dedupMap));
    movementSnapshots = priorMovementSnapshots;
  }

  statusEl.textContent = 'Done: ' + results.pass + ' passed, ' + results.fail + ' failed.';
  statusEl.style.color = results.fail ? '#ff5d5d' : '#4ade80';
  window.__harnessResults = results;
  console.log('HARNESS_RESULT', JSON.stringify({ pass: results.pass, fail: results.fail, failures: results.failures }));
})();
