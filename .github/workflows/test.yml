name: Apps Script tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # fetch-depth: 0 -> full history, so check-catalog.py can run
        # `git log <verified-sha>..HEAD -- <path>` (Last-Verified drift, D)
        # and `git diff <before>..<after>` (change -> component-ID impact,
        # E). Forensic audit P0/P1 (t-tf-5ad22d8e4c2e).
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Run Apps Script test suite (Tests_*.gs)
        run: node test/run-gs-tests.js
      # CI-003 (To-Do Dashboard): warn-only documentation-coverage check
      # (CI-001/CI-002) -- prints its summary to this log but never affects
      # this job's pass/fail result, hence continue-on-error: true as a
      # belt-and-braces guard even though check-docs-coverage.js's own
      # main() already always calls process.exit(0) itself. Graduates to a
      # real blocking step only once CI-005 confirms graduation criteria
      # against DOCUMENTATION_PROJECT_PLAN.md's Phase 5 (DOC-039) -- not
      # done here.
      - name: Documentation coverage check (warn-only)
        run: node test/check-docs-coverage.js
        continue-on-error: true
      # docs/ change-control tripwires (t-tf-5ad22d8e4c2e). BLOCKING on
      # checks A/B/C -- INDEX.md reciprocity, INDEX <-> record-file
      # coverage both ways, and INDEX Location -> real file. All three are
      # green as of 2026-09-10, so a failure here is a real regression
      # (a broken back-link, a record without a row, a row pointing at a
      # deleted file). Checks D (Last-Verified drift) and E (change ->
      # component-ID impact + the ready-to-run revalidation-task ops JSON)
      # only PRINT -- set CATALOG_STRICT=1 to make them blocking too.
      - name: Catalog change-control tripwires
        run: python3 test/check-catalog.py
        env:
          DIFF_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
          DIFF_HEAD: ${{ github.sha }}

  # Frontend render-pipeline harness (tests/frontend-harness.html) headless.
  # Forensic audit P2 item 13 (t-tf-5ad22d8e4c2e). Its own job on the
  # OFFICIAL Playwright container -- chromium + every system dependency +
  # a matching `playwright` npm package are already in the image, so there
  # is no browser download / apt step to be flaky (the ~28s failure that
  # reverted the first blocking attempt, fd59944, was a missing-system-libs
  # launch error on the bare runner). BLOCKING: a real assertion failure
  # from run-frontend-harness.mjs fails this job. Kept a separate job so
  # the fast Node/Python `test` job above is never gated on a browser.
  frontend-harness:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.47.2-jammy
    steps:
      - uses: actions/checkout@v5
      - name: Install playwright (browsers already in the image)
        run: npm i --no-save playwright@1.47.2
      - name: Run the harness
        # test/serve-and-harness.mjs starts a tiny Node static server on
        # the repo root, waits for it, runs run-frontend-harness.mjs
        # against it, and exits with its code. Pure Node -- no python3 /
        # curl / seq dependency on the container image.
        run: node test/serve-and-harness.mjs
